# TIDMAD, composed through the SAME loader every other task uses.
#
# The point of this fixture is that nothing here is special. The
# compatibility id `tidmad` is an ordinary declared id, the shipped configs
# are ordinary refs, and the framework's three built-in metric classes are
# reached by the same `module:`/`symbol:` mechanism an out-of-tree task uses
# for its own file. If composing TIDMAD needed one extra affordance, the
# claim "a fourth task needs zero framework edits" would be untestable.

task_data_path:
  module: execute_tools.tidmad_data_path
  symbol: TidmadTaskDataPath
  id: tidmad

dataset_profile:
  config: ../../../../examples/tidmad/resolved/dataset_profile.json

metric:
  declaration: ../../../../examples/tidmad/resolved/metric_spec.json
  implementation:
    module: execute_tools.evaluation_metric
    symbol: TidmadDenoisingMetric

task_health:
  config: ../../../../configs/task_health/tidmad.yaml

interpretation_blocks:
  config: ../../../../configs/task_interpretation/tidmad.yaml

# Step 12 / PR-12a C7. Declared here for the same reason as everywhere else in
# this file: the shipped manifest declares them, and the W2 invariant is that
# these two are the SAME composition. A fixture that quietly declared less
# would make the shipped manifest's fingerprint untestable.
proposal_blocks:
  config: ../../../../configs/task_proposal/tidmad.yaml

implementor_blocks:
  config: ../../../../configs/task_implementor/tidmad.yaml

task_config:
  config: ../../../../configs/task_config.yaml
