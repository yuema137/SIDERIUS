# DAVIS 2017 future-frame prediction — the third track, and the one whose
# metric is LOWER-is-better. Same six sections, same loader; the direction is
# a value the declaration carries, never a branch the framework takes.
#
# Scope note: as with Pets, the profile and task config are COMPOSITION
# fixtures.
#
# Step 10 / P5+P6 C6 UPDATE: ORCHESTRATION closure is DONE — DAVIS is the
# lower-is-better falsifier, driven for >= 2 iterations through the one
# generic `run_workflow` with both carried values live. REAL task-correct
# TRAINING through the loop is NOT delivered here and requires **CAP-SCOPE**
# (design §10.2); real DAVIS execution evidence stays with
# `scripts/run_davis_gate2.py`. Step 12 MUST NOT claim contrast-track L4
# while CAP-SCOPE is open.

task_data_path:
  module: execute_tools.davis_data_path
  symbol: DavisTaskDataPath

dataset_profile:
  config: dataset_profile.json

metric:
  declaration: ../../../../examples/davis_future_prediction/declared/metric_mse.json
  implementation:
    module: execute_tools.evaluation_metric
    symbol: GlobalMseMetric

# Step 10 / P2b — the mixed-direction control. The primary `mse` is
# LOWER-is-better; `psnr` is HIGHER and `mae` is LOWER, so a carrier that
# inherited the primary's direction would render psnr backwards and a
# carrier that inherited a single secondary direction would render mae
# backwards. Manifest order is semantic and is what the output stamps.
secondary_metrics:
  # Step 12 / PR-12d D4c: both were bound to `GlobalMseMetric`, which
  # computes NEITHER of them — a terminal report could read `psnr / HIGHER`
  # while mean squared error executed. Composition accepted it because the
  # only identity check compared the declaration to itself (F-12d-3). Now
  # bound to the pack's own implementations, through the `file:` route, which
  # is what makes these declarations executable rather than decorative.
  - declaration: ../../../../examples/davis_future_prediction/declared/metric_psnr.json
    implementation:
      file: ../../../../examples/davis_future_prediction/plugins/_davis_metrics.py
      symbol: DavisPsnrMetric
  - declaration: ../../../../examples/davis_future_prediction/declared/metric_mae.json
    implementation:
      file: ../../../../examples/davis_future_prediction/plugins/_davis_metrics.py
      symbol: DavisMaeMetric

task_health:
  config: ../../../../examples/davis_future_prediction/declared/task_health.yaml

interpretation_blocks:
  none: true

task_config:
  config: task_config.yaml
