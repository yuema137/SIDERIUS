# Oxford-IIIT Pet — the pack's OWN task description + forward contract.
#
# Step 12 / PR-12d D5. Q-12d-1: task-owned declarations CO-LOCATE with the
# pack; `configs/task_composition/pets.yaml` only POINTS here and carries no
# second copy of any of it. Nothing under `configs/` describes this task.
#
# The framework's own `configs/task_config.yaml` stays TIDMAD's and is not
# consulted by a composed Pets run — `_compose_task_config` loads whatever the
# manifest's `task_config.config:` names, through the SAME `load_task_config`
# a legacy run uses.
#
# Semantics are §22.9a's FROZEN Track-B specification, transcribed, not
# invented: 37-way pet-BREED classification from real RGB JPEGs, accuracy on
# the final-eval scope, HIGHER is better.

task_description: |
  37-way fine-grained pet-breed classification of real Oxford-IIIT Pet RGB
  photographs. A model receives one preprocessed image tensor and predicts a
  single breed label out of 37; the golden metric is accuracy over the
  final-eval scope and HIGHER is better. Raw images vary in resolution,
  aspect, scale and lighting, so the frozen preprocessing (decode RGB →
  aspect-preserving resize to shorter side 160 px, bilinear → 144x144 center
  crop → pixel/255.0, no augmentation) is part of the task definition rather
  than a tuning knob.

forward_contract:
  # Step 03 — `model_io:` is THE authority; `input_shape`/`output_shape`/
  # `num_classes` are DERIVED from it (`ForwardContract` validator) and are
  # deliberately not authored here, mirroring TIDMAD's own
  # `configs/task_config.yaml`. This is the SAME structured declaration
  # `declared/model_io_contract.json` carries (the pack's frozen L1 fixture,
  # read directly by `tests/unit/examples/test_oxford_iiit_pet_pack.py`) —
  # kept as two files because they serve two different, both load-bearing
  # roles (a pinned fixture the pack's own tests assert against, and the
  # live declaration `run_bound_model_io_contract()` resolves at run time),
  # with a cross-check test (`test_step12_pr12d_g12d_model_io_wiring.py`)
  # asserting they never diverge.
  #
  # Found the hard way (G-12d Track 2, real launch): with `model_io`
  # undeclared, the admission resource-check's dtype resolution has no
  # contract to consult and falls back to the int64 site preference that is
  # correct for TIDMAD's raw-signal models and wrong for this float-native
  # image CNN — `RuntimeError: Input type (long int) and bias type (float)
  # should be the same`, 100% reproducing. An EARLIER version of this
  # comment block reasoned that authoring `model_io:` here would duplicate
  # `model_io_contract.json` for no live consumer; that was wrong —
  # `task_config.yaml`'s `model_io` is the ONLY one of the two paths any
  # real execution actually reads.
  model_io:
    input:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {dimension: {fixed: 3}}
        - {dimension: {fixed: 144}}
        - {dimension: {fixed: 144}}
      dtype: {admissible: ["float32"]}
    output:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {role: class, dimension: {fixed: 37}}
      dtype: {admissible: ["float32"]}
  input_description: >-
    a batch of preprocessed RGB images, channels-first, already scaled to
    [0, 1]; no augmentation and no per-channel normalization is applied
  output_description: "per-breed logits, one score per Oxford-IIIT Pet class"
  task_type: "classification"
  output_head_note: >-
    Output must be exactly [B, 37] — a final Linear(features, 37). Do NOT
    apply softmax inside the model: the deliverable codec and the terminal
    metrics own that decision.
  task_note: >-
    Single-label classification over a fixed, balanced 37-breed alphabet
    (~200 images per breed). There is no temporal or sequential structure
    here; the useful signal is spatial.
