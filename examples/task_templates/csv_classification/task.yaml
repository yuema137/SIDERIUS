# Task package manifest. Every path below is relative to this folder, so the
# folder can be copied anywhere (for the console: siderius_workspace/tasks/<id>/).
# Lines marked EDIT HERE are the ones to change for your dataset; the README
# lists them in order.

task_data_path:
  file: plugins/_csv_task.py
  symbol: CsvClassificationTaskDataPath
  config:
    # EDIT HERE: file names inside the data folder (data/<task_id>/).
    train_file: train.csv
    validation_file: validation.csv
    # EDIT HERE: the column holding the class label, and every label value
    # exactly as written in the CSV. The position in the list is the class
    # index the model predicts (first = 0).
    label_column: label
    classes: [setosa, versicolor, virginica]
    # EDIT HERE: the column with a unique ID per row, or null to use the row
    # number.
    id_column: sample_id
    # EDIT HERE: how many feature columns. By default every column except the
    # label and ID columns is a feature; list them in `feature_columns:` to
    # use only some.
    feature_count: 4

dataset_profile:
  config: declared/dataset_profile.json

metric:
  declaration: declared/metric_balanced_accuracy.json
  implementation:
    file: plugins/_csv_metrics.py
    symbol: BalancedAccuracyMetric

# OPTIONAL: tell every agent what the score means. Uncomment the block to use
# it; while it stays commented the task is exactly as shipped. With
# `selection: kind: primary`, models are still ranked by the metric above.
# Formulas, constraints and rubric rules: docs/guides/evaluation/README.md in
# the SIDERIUS checkout.
# evaluation:
#   components:
#     - kind: metric
#       id: balanced_accuracy
#       metric: balanced_accuracy        # the metric id declared above
#       meaning: Mean per-class recall on validation.csv; each class counts equally.
#       units: fraction (0 to 1), mean over classes
#       range: {lower: 0.0, upper: 1.0}  # descriptive only; no clipping or rescaling
#   selection:
#     kind: primary

objective:
  config:
    loss_type: ce
    reduction: mean

task_health:
  config: declared/task_health.yaml

interpretation_blocks:
  none: true

deliverable:
  prefix: csv_predictions
  extension: .json
  index_width: 4

task_config:
  config: declared/task_config.yaml

# Limited parameters: the agents must keep these values inside the rule.
parameter_rules:
  # EDIT HERE: change or remove. `range` limits the agents' choice; `exact: 32`
  # fixes a value; `allowed: [16, 32]` lists the permitted values. The range
  # starts at 1 so a training scope smaller than one batch (small data in a
  # Trial round) is trained with a smaller batch; an `exact` lock refuses it.
  train_config.batch_size:
    range: {min: 1, max: 32}

model_plugins:
  dir: plugins
  require: [csv_reference_mlp]
