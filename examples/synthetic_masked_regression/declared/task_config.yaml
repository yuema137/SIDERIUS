task_description: |
  Tiny deterministic regression over three synthetic features. The model
  predicts one continuous value. Supervision carries both the target and an
  explicit validity mask; invalid rows are transported but never contribute
  to the training objective or terminal metrics.

forward_contract:
  segmentation_applicability: not_applicable
  model_io:
    input:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {dimension: {fixed: 3}}
      dtype: {admissible: ["float32"]}
    output:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {dimension: {fixed: 1}}
      dtype: {admissible: ["float32"]}
    inference:
      accepted_input_view_formats: ["siderius.numeric-array.v1"]
      required_information:
        - {information_class: data}
      prediction_output_format: "siderius.numeric-array.v1"
      prediction_semantic_id: "synthetic.scalar-prediction.v1"
      prediction_decoder_protocol_id: "siderius.identity-prediction-decoder.v1"
      alignment: "one_prediction_per_input"
      determinism: "deterministic"
  supervision_target:
    axes:
      - {role: batch, dimension: {symbolic: "B"}}
      - {dimension: {fixed: 2}}
    dtype: {admissible: ["float32"]}
  custom_loss_applicability:
    mode: explicit_pair
    prediction:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {dimension: {fixed: 1}}
      dtype: {admissible: ["float32"]}
    target:
      axes:
        - {role: batch, dimension: {symbolic: "B"}}
        - {dimension: {fixed: 2}}
      dtype: {admissible: ["float32"]}
  input_description: "three continuous synthetic features in [-1, 1]"
  output_description: "one continuous prediction per row"
  task_type: "regression"
  output_head_note: "Output exactly [B, 1]; the validity mask belongs to supervision, not model output."
  task_note: "The custom objective consumes target [truth, validity_mask] and refuses shape-only surrogates."
