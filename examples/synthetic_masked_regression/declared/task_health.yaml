facts:
  encoding_family: continuous_float

plugins:
  - kind: file
    ref: ../plugins/_masked_health_views.py

providers:
  - provider_id: synthetic_masked_regression.valid_predictions

roster:
  - gate_id: synthetic_masked_prediction_dispersion
    check: sample_dispersion_floor
    disposition: blocking
    parameters:
      min_dispersion: 0.1
    reason: >-
      A constant or near-constant regressor output is not useful evidence that
      the example's continuous prediction path is operating. The threshold is
      a demonstration boundary exercised by fixed synthetic controls, not a
      scientific calibration.
