# Machine-specific data paths — TEMPLATE.
#
# This file is the tracked template. The real config lives in
# `tidmad_data_config.yaml` (gitignored), which each developer creates
# once on first checkout:
#
#     cp tidmad_data_config.example.yaml tidmad_data_config.yaml
#     # then edit the paths below for your machine
#
# DO NOT edit this template with machine-specific paths — your edits
# will be visible to every other developer through git.

# Where the raw TIDMAD HDF5 files live
# (abra_training_0000.h5..0019.h5 + abra_validation_0000.h5..0019.h5).
# The scoring anchor map ships committed at reference_data/segment_anchors.json,
# so it is NOT required in this directory.
tidmad_data_dir: /path/to/TIDMAD/

# Where SIDERIUS run outputs are written
# (per-model subdirs: punet/, wavenet/, fcnet/, gated_fno/, ...).
siderius_data_dir: /path/to/SIDEREIS_DATA/

