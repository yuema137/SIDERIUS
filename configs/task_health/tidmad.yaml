# configs/task_health/tidmad.yaml
#
# TIDMAD's TASK-OWNED Health configuration (Step 08b C5).
#
# Everything here is the TASK's: which gates exist, which checks they run,
# where the scientific boundaries are, which files they watch, the physical
# value scale, and why each gate exists. None of it is framework policy —
# gate role, cadence, short-circuit and actions are derived by the framework
# from each entry's `disposition`, and this file cannot state them (see
# execute_tools/health_checks/_task_health_config.py). `aggregation` is the
# one exception: since PR #357 it is in TASK_DECLARABLE_POLICY_KEYS, so the
# framework's value is a DEFAULT and a roster entry MAY declare its own.
#
# It moved out of configs/health_checks.yaml unchanged. Every threshold,
# gate id, check id, peek file and reason string below is byte-for-byte the
# value that file carried at commit e4b06ae1; the migration is an OWNERSHIP
# change, not a retuning. The framework file now carries policy only.
#
# `value_scale` replaces the `_MV_PER_LSB = 40.0 / 128.0` literal that was
# duplicated in FOUR check modules and declared by nothing. The unit and the
# number live together here because separating them is how a millivolt
# threshold silently becomes a volt threshold.
#
# In-repo residence is REFERENCE PACKAGING, not a framework dependency: an
# external task supplies its own file anywhere on disk and needs no SIDERIUS
# edit to do so.

facts:
  encoding_family: int8_symbol_stream
  symbol_cardinality: 256
  file_group_size: 20
  sampling_frequency_hz: 10000000.0
value_scale:
  unit: mV
  units_per_sample: 0.3125
health_peek_files:
- 3
- 10
- 17
roster:
- gate_id: output_diversity_blocking
  check: output_diversity
  disposition: blocking
  parameters:
    min_unique_int8_values: 25
    peek_samples: 100000
  reason: 'Blocking diversity gate. FCNet real-learning reproduction has unique_int8=127+;
    the worst observed non-collapse baseline had 15. Threshold of 25 gives 2.08×
    FCNet safety margin and 40% baseline rejection headroom. M9 peek: [3, 10,
    17] + all_pass (C2 flip, 2026-08-26) — file 3 is the narrowest-margin FCNet
    band (52 uniq), file 10 first mid-band exemplar (127), file 17 high-band
    exemplar (143). All_pass means a real learning model must clear the bar on
    EVERY peeked file; diversity collapse on any single peeked file fails the
    gate.'
  uses_health_peek_files: true
- gate_id: output_std_blocking
  check: output_std
  disposition: blocking
  parameters:
    min_std_mv: 1.0
    peek_samples: 100000
  reason: 'Blocking std gate. Complements output_diversity — an output with many
    unique values but tight std (edge-case not observed but theoretically possible)
    would also fail here. 1.0 mV threshold gives ~5× margin above worst-observed
    collapse (0.19 mV). M9 peek matches output_diversity: [3, 10, 17] + all_pass
    (C2 flip, 2026-08-26).'
  uses_health_peek_files: true
- gate_id: amplitude_collapse_blocking
  check: amplitude_collapse
  disposition: blocking
  parameters:
    collapse_threshold: 0.95
    peek_samples: 100000
  reason: 'Blocking amplitude gate. Catches single-value-dominance collapse even
    when unique_count is above threshold (e.g. output has 40 unique values but
    96% are the same one). Threshold 0.95 unchanged from rev-6; extended to every
    round. M9 peek: [3, 10, 17] + all_pass (C2 flip, 2026-08-26): a partial-collapse
    case where ONE peeked file has 96% dominance now fails the gate even when
    the other two are healthy. The flip discharges the m9 execution plan §9 Q1
    deferral of exactly this choice to post-V17 empirical validation.'
  uses_health_peek_files: true
- gate_id: pearson_dispersion_recording
  check: pearson_dispersion
  disposition: recording
  parameters:
    peek_samples: 1000000
  reason: 'Records the spread of per-file pearson(CH1_denoised, CH2_target) as
    a single scalar: pearson_dispersion = stdev(per_file_pearsons, ddof=1). Empirical
    24× separation between real learning (FCNet ~0.048) and paper-spec collapse
    (~0.002). Per-file pearson values are computed internally but NOT exposed
    — they were shown to be uninformative per-file (noise-limited on files 0-9;
    can sign-invert on high-signal files). See docs/design/paper_and_collapse_reference_baselines.md
    §6.3.'
- gate_id: spectral_peak_ratio_recording
  check: spectral_peak_ratio
  disposition: recording
  parameters:
    peek_samples: 1000000
  reason: Records PSD(f_inj) / median(PSD_around_f_inj) per file. Direct spectral
    analog of the scoring pipeline's SNR; useful for detecting the "phantom scored
    high" case without triggering it. Never blocks.
- gate_id: per_file_output_std_recording
  check: per_file_output_std
  disposition: recording
  parameters:
    peek_samples: 100000
  reason: Records per-file output std distribution (mean, min, max, per-file list).
    Complements output_std_blocking (aggregate) with per-file granularity for
    diagnosis. Never blocks.
