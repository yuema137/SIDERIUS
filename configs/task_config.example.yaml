# configs/task_config.example.yaml
# Shape-only example for caller-owned task configuration. Real runs normally
# provide these values through --task_composition; this file is never selected
# implicitly.
# ---------------------------------------------------------------------------

# Plain-English description of the research task.
# Injected into the {TASK_DESCRIPTION} placeholder in all agent system prompts
# (implementor, proposer, lit-review search/synthesis/extract).
# Keep this concise — it appears in every LLM call.
task_description: |
  classify each fixed-length feature vector into one of three synthetic
  categories.

# Forward contract for the model plugin interface.
# Injected into the {FORWARD_CONTRACT} placeholder in implementor and proposer
# system prompts. Must describe the exact PyTorch tensor shapes and types
# expected by the training engine and validator.
forward_contract:
  # Required for a composed task-owned resource probe. Declare whether the
  # probe identity includes a temporal segmentation dimension.
  segmentation_applicability: not_applicable
  input_shape: "[B, 8] float32"
  input_description: "eight normalized synthetic features"
  output_shape: "[B, 3] float32"
  output_description: "unnormalized logits for three classes"
  num_classes: 3
  output_head_note: "Return exactly one logit vector per input row."
  task_type: "classification"
  task_note: "This is documentation-only synthetic content."
