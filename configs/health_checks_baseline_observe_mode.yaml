# configs/health_checks_baseline_observe_mode.yaml
#
# FRAMEWORK HealthGate policy — OBSERVE-ONLY variant. Step 08b C5.
#
# Identical to `configs/health_checks.yaml` except for ONE field:
#
#     blocking.on_fail:  invalidate_round  ->  continue
#
# That was always the only difference between the two shipped configs; before
# C5 it was buried in a duplicated six-gate roster, and now it is the whole
# file. Used for baseline characterization runs where a degenerate result
# must be MEASURED rather than discarded.
#
# `gate_role: blocking` is deliberately unchanged here. The role is a
# property of the SCIENCE, not of enforcement — deriving it from the action
# instead does not merely lose information, it INVERTS the answer: under this
# config every action is `continue`, so an action-derived scientific set
# would be EMPTY and every record would classify as valid. That was a live
# defect (see `resolve_scientific_gate_ids`).
#
# The gate roster, thresholds, peek set, value scale and reason prose are
# task-owned and live in `configs/task_health/tidmad.yaml` — shared by both
# policy files, so observe mode cannot drift from production science.

health_policy:
  blocking:
    gate_role: blocking
    after_round: every
    short_circuit: true
    on_pass: continue
    on_fail: continue                 # THE observe-mode difference
    check_config:
      aggregation: all_pass           # C2 flip — tracks configs/health_checks.yaml;
                                      # on_fail above stays the ONLY difference

  recording:
    gate_role: observational
    after_round: every
    short_circuit: false
    on_pass: continue
    on_fail: continue
    check_config: {}
