# Oxford-IIIT Pet — the SHIPPED task composition. Step 12 / PR-12d D5.
#
# The operator entrypoint:
#
#     run_chain.sh ... --task_composition configs/task_composition/pets.yaml
#
# **This file is a POINTER, not a second copy of the task** (Q-12d-1).
# Every semantic value Pets owns — its dataset profile, its task description
# and forward contract, its metric declarations, its Health family, its
# plugins — lives under `examples/oxford_iiit_pet/`, co-located with the pack
# that owns them. What is written here is only WHICH declaration each family
# resolves to. The framework never scans the pack; it reads exactly the refs
# below.
#
# Paths resolve against THIS file's directory (`workflows/task_composition.py`
# resolves refs relative to the manifest), which is why they are `../`-rooted.
#
# Nothing here is special-cased. `oxford_iiit_pet` is an ordinary declared id
# and every family is reached by the same mechanism TIDMAD's manifest uses —
# which is the whole point: if composing a contrast task needed one extra
# affordance, "a fourth task needs zero framework edits" would be untestable.

task_data_path:
  module: execute_tools.pets_data_path
  symbol: PetsTaskDataPath
  id: oxford_iiit_pet
  # Seam A / D1's task-instance configuration. `manifest_path` is a key
  # PetsTaskDataPath's OWN constructor understands; the framework validates
  # the shape and knows nothing about the name. The `{ref: ...}` envelope is
  # how the TASK says "this value is a manifest-relative path", so the pack
  # composes identically wherever it is checked out and from whatever cwd.
  #
  # The bounded Gate subset, not the full 2 946-row training scope: a 1x1
  # formal round is a plumbing witness, not a benchmark.
  #
  # BOTH manifests are declared — F-12d-17's closure. This pack ships three
  # DISJOINT role manifests and the `scope` column inside each is constant,
  # so the role IS the file. Declaring only `manifest_path` would make a
  # composed run train and evaluate on the identical 370 images, because
  # `build_eval_scope` falls back to the training manifest when
  # `eval_manifest_path` is absent. The D14 runner never showed this: it
  # loads all three itself and passes both scopes explicitly.
  #
  # The frozen FINAL-eval scope (`gate2_final.csv`) is deliberately NOT named
  # here, so no composed run can contaminate it — `gate2_validation.csv` is
  # the composed-run evaluation set.
  config:
    manifest_path:
      ref: ../../examples/oxford_iiit_pet/data/manifests/gate2_train.csv
    eval_manifest_path:
      ref: ../../examples/oxford_iiit_pet/data/manifests/gate2_validation.csv

dataset_profile:
  config: ../../examples/oxford_iiit_pet/declared/dataset_profile.json

metric:
  declaration: ../../examples/oxford_iiit_pet/declared/metric_accuracy.json
  # Step 12 / PR-12d: the PACK'S OWN implementation, not the framework's
  # same-named one. Both compute identical arithmetic; they differ in calling
  # vocabulary. The framework's takes `predictions`/`truth` already assembled,
  # which suits the in-process D14 runner; the composed SCORING CHILD owns only
  # `evaluation_payload`/`task_scope`/`data_dir`, because assembling truth from
  # a scope is TASK knowledge. Binding the framework metric here failed a REAL
  # scoring child with `TypeError: ... unexpected keyword argument
  # 'evaluation_payload'`.
  implementation:
    file: ../../examples/oxford_iiit_pet/plugins/_pets_metrics.py
    symbol: PetsAccuracyMetric

# §22.9a's frozen OPTIONAL TERMINAL metrics, both observational. They are
# bound by an out-of-tree `file:` ref to the pack's own implementations, so
# each one's CONTENT digest joins this composition's semantic fingerprint —
# an edited pack metric fails a resume closed instead of silently computing
# something else under an unchanged declaration.
#
# `log_loss` is the identity §22.9a chose deliberately (Rev 5 §22.1): a
# legitimate terminal metric whose name contains "loss". It is declarable
# because PR-12a C5 removed D16 — `MetricSpec.id` is OPAQUE, and what
# separates a metric from a loss is the contract, not the spelling.
secondary_metrics:
  - declaration: ../../examples/oxford_iiit_pet/declared/metric_macro_f1.json
    implementation:
      file: ../../examples/oxford_iiit_pet/plugins/_pets_metrics.py
      symbol: PetsMacroF1Metric
  - declaration: ../../examples/oxford_iiit_pet/declared/metric_log_loss.json
    implementation:
      file: ../../examples/oxford_iiit_pet/plugins/_pets_metrics.py
      symbol: PetsLogLossMetric

task_health:
  config: ../../examples/oxford_iiit_pet/declared/task_health.yaml

# A NAMED absence, not an omission: Pets ships no interpretation science, and
# saying nothing at all would be `LEGACY_OMITTED` — the state that resolves
# TIDMAD's family. `proposal_blocks` and `implementor_blocks` are genuinely
# optional (their absence renders no header and no bytes), so they are left
# unstated rather than declared empty.
interpretation_blocks:
  none: true

task_config:
  config: ../../examples/oxford_iiit_pet/declared/task_config.yaml

# Step 12 / PR-12d D8a — CLOSES F-12d-2 ("the pack model plugins have no
# route into a composed run's registry"). `plugin_loader._resolve_plugin_dirs`
# reads SIDERIUS_PLUGIN_DIRS, else the legacy AGENT_GENERATED_DIR; the chain
# launchers inject neither for a composed run. Without this section a composed
# Pets run has no way to make `pets_reference_cnn` visible — proven live:
# `active_run_model_plugin_roots()` returned `()` with this section absent.
#
# Mirrors DAVIS' `model_plugins:` exactly (seam P / DP), which is what
# closed the identical gap there.
model_plugins:
  dir: ../../examples/oxford_iiit_pet/plugins
  require: [pets_reference_cnn]
