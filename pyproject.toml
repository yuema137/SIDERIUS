[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siderius"
version = "0.2.0rc6"
description = "Closed-loop research framework for supervised scientific machine learning: LLM agents propose, implement and interpret models; deterministic infrastructure trains, scores and guards them"
readme = "README.md"
authors = [{ name = "SIDERIUS developers" }]
# CI runs on Python 3.12 exactly (`uv python install 3.12` in
# .github/workflows/ci.yml); the range below is deliberately left as the
# lock-compatible ">=3.12" — narrowing it would invalidate the committed
# uv.lock, and 3.12 is the only continuously verified interpreter.
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "iminuit>=2.32.0",
    "jax[cpu]>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "openai>=2.26.0",
    "pandas>=3.0.1",
    "pdfplumber>=0.11.0",
    # Direct dependency: externally supplied image-task plugins may decode
    # samples with PIL through the supported task data-path interface. Do not
    # rely on matplotlib or pdfplumber to install that public dependency
    # transitively.
    "pillow>=11.0.0",
    "pydantic>=2.12.5",
    "pylatexenc>=2.10,<3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scipy>=1.17.1",
    "scitokens>=1.8.1",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.2",
    "torchinfo>=1.8.0",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*", "nodes*", "core*", "execute_tools*", "ml_models*",
    "tools*", "workflows*", "dashboard*",
]
exclude = ["agent_generated*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
execute_tools = ["health_checks/resources/health_checks.yaml"]
agent = ["schemas/*.json", "prompt_templates/**/*.md", "skills/*/skill_config.json"]
nodes = ["*.md", "*/*.md"]
ml_models = ["*.md", "*/description.md"]
dashboard = ["static/*.html", "static/*.js", "static/*.css"]
tools = ["ci/weights.json", "claude_hooks/templates/*.md"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_run: requires an external provider. Skipped unless a real-LLM flag is passed. Run locally only with: pytest -m real_run --real-llm",
    "allow_real_subprocess: this unit test intentionally launches a real training/inference/scoring script. Without it, tests/unit/conftest.py fails fast rather than letting a missing stub start real work.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "agent_generated",
    "notebooks",
    "reports",
    "siderius_workspace",
    "claude",
    "claude_sdsc_chain_test",
    "fm-agent-repo",
    "legacy_repo",
    "__pycache__",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # E501 is line-too-long; we set line-length=100 and the formatter
    # handles enforcement. Disable the lint check so comments and
    # f-strings that legitimately run long aren't constant friction.
    "E501",
]
# Math notation we use deliberately in docstrings, prompts, and comments.
# RUF001/RUF002/RUF003 stay enabled for every OTHER confusable (this is
# narrow scope calibration, not blanket muting):
#   ×  U+00D7 MULTIPLICATION SIGN  — ratios like "1.60×", dimensions T²×B
#   −  U+2212 MINUS SIGN           — math equations
#   α  U+03B1 GREEK SMALL ALPHA    — loss / hyperparameter notation
#   ∪  U+222A UNION                — set notation (e.g. Best-3 ∪ Last-2)
allowed-confusables = ["×", "−", "α", "∪"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts, longer fixtures, and unused
# imports for fixture side effects; keep style enforcement off in tests.
"tests/**" = ["F401", "F811", "B011", "SIM"]
# Preserve thematic section banners, fixture locality, and local aliasing
# within unit tests (intentional mid-file imports under section headers).
"tests/unit/agent/**/test_*.py" = ["E402"]
"tests/unit/core/test_resume.py" = ["E402"]
"tests/unit/core/test_sandbox_executor.py" = ["E402"]
"tests/unit/workflows/test_model_exploration.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
