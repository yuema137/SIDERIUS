name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-flight run if a new commit lands on the same ref. Saves
# Actions minutes when a contributor force-pushes a PR rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev --frozen

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Lint — ruff format (check only, no rewrite)
        run: uv run ruff format --check .

      - name: Type check — pyright (diagnostic, non-blocking)
        run: uv run pyright
        continue-on-error: true

      - name: Unit tests — pytest (no real_run, no integration)
        run: uv run pytest tests/unit/ -m "not real_run" -q
