name: CI

on:
  push:
    branches: [master]
  # Include stacked PRs targeting feature branches; selection uses their actual base.
  pull_request:
  # Nightly full suite. The selective PR path is a speed optimisation, not a
  # coverage reduction: master and this schedule always run everything, so a
  # selector mistake costs at most one night, never a silent permanent gap.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Cancel an in-flight run if a new commit lands on the same ref. Saves
# Actions minutes when a contributor force-pushes a PR rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type + Unit Tests
    runs-on: ubuntu-latest
    # Raised 15 -> 25 during Step 05c (2026-08-15). NOT a 05c-specific need:
    # master's own runs were already at the ceiling, and two master PUSH runs
    # (31855504278, 31855238181) were cancelled at it before this branch
    # existed. The last SUCCESSFUL master run (31857482569) measured:
    #
    #     install 47s · ruff 1s · pyright 2m17s · pytest 10m28s
    #     ---------------------------------------------------------------
    #     total 13m38s  ->  1m22s of headroom against a 15-minute cap
    #
    # A ~9,300-test suite that grows by a few dozen cases per PR then flips
    # the job from green to `cancelled` — a result that looks like a failure,
    # carries no failing test, and tells a reviewer nothing. This is a
    # resource ceiling, not a correctness guard; raising it changes what CI
    # tolerates in wall-clock, never what it accepts as passing.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the selector diffs against the PR base, and a shallow
          # clone would make that diff fail. A failed diff falls back to the
          # full suite (below), but paying for history is cheaper than paying
          # for a full suite on every PR.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev --frozen

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Lint — ruff format (check only, no rewrite)
        run: uv run ruff format --check .

      # The configured basic baseline and diagnostic overrides are authoritative.
      # See CLAUDE.md for policy; pyrightconfig.json owns scope and severities.
      - name: Type check — pyright (configured basic)
        run: uv run pyright

      # ---- selective unit tests -------------------------------------------
      # PR runs only the suites the changed paths can affect; master, the
      # nightly schedule and any ambiguity run everything. The selector is
      # fail-closed by construction (`tools/ci_selection/`): an unmapped path,
      # a declared hub, a change to the selector itself, or ANY exception all
      # resolve to the full suite.
      - name: Resolve affected test suites
        id: selection
        run: |
          # NO `set -e` here, deliberately. Every failure below must fall back
          # to the FULL SUITE, never fail the build and never skip tests. A
          # selector that can break CI is a selector people switch off.
          full() {
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            echo 'pytest_args=tests/unit/ -m "not real_run" -q' >> "$GITHUB_OUTPUT"
            echo "FULL SUITE: $1" >&2
            exit 0
          }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full "${{ github.event_name }} runs everything by policy"
          fi
          git fetch --no-tags origin "${{ github.base_ref }}" \
            || full "could not fetch the base ref"
          CHANGED_RAW="$RUNNER_TEMP/ci_changed_name_status.z"
          CHANGED_JSON="$RUNNER_TEMP/ci_changed_files.json"
          git diff --name-status -z "origin/${{ github.base_ref }}...HEAD" > "$CHANGED_RAW" \
            || full "could not diff against the base ref"
          if [ ! -s "$CHANGED_RAW" ]; then
            full "empty diff"
          fi
          # SINGLE SOURCE. The diff is computed exactly once and written here;
          # the harness step consumes this file rather than recomputing it. Two
          # independent `git diff` invocations could disagree, and the selector
          # step's verdict would then differ from the set actually executed.
          # Every `full` path above exits before this line, so the file is
          # absent for a full-suite run — which the harness reads as "no
          # changed-file input", its own fail-closed full suite.
          uv run python -m tools.ci_selection \
            --name-status-z \
            --write-paths-json "$CHANGED_JSON" < "$CHANGED_RAW" \
            || full "the selector exited non-zero"
          grep -q '^pytest_args=' "$GITHUB_OUTPUT" \
            || full "the selector produced no pytest_args"

      # ---- unit tests via the repository-owned harness ---------------------
      # The harness (`tools/ci/`) owns HOW tests execute: preflight, weighted
      # file-level shards, per-shard TMPDIR and thread pinning, the sensitive
      # lane, and result aggregation. It COMPOSES `tools.ci_selection` for WHAT
      # runs — the selector remains the single authority and is not duplicated
      # here. See docs/testing/ci_parity.md.
      #
      # CI RESOURCE PROFILE — explicit, not auto-detected. Python 3.12 has no
      # os.process_cpu_count(), sched_getaffinity does not see cgroup quotas,
      # and no repository helper reports an effective CPU budget, so an
      # auto-detector would be guessing. ubuntu-latest is documented as 4 vCPU;
      # 4 shards x 1 thread matches that without oversubscription. The shard cap
      # is 4 because the measured floor is a single 460 s file — more shards
      # cannot go faster. `cpu_count` is recorded in the manifest so the FIRST
      # remote run corrects this profile with fact rather than assumption.
      - name: Unit tests — repository CI harness (no real_run, no integration)
        env:
          CI_BULK_SHARDS: "4"
          CI_SHARD_THREADS: "1"
        run: |
          set -euo pipefail
          echo "full_suite=${{ steps.selection.outputs.full_suite }}"
          # Consume the ONE changed-file list the selector step produced. The
          # harness then asks tools.ci_selection itself, so the selector remains
          # the single authority for WHAT runs and nothing is re-derived here.
          # A full-suite verdict leaves that file unwritten, and the harness
          # fail-closes to the full suite on a missing file.
          CHANGED_ARG=""
          if [ "${{ steps.selection.outputs.full_suite }}" != "true" ] \
             && [ -s "$RUNNER_TEMP/ci_changed_files.json" ]; then
            CHANGED_ARG="--changed-from $RUNNER_TEMP/ci_changed_files.json"
          fi
          uv run python -m tools.ci bulk \
            --root . \
            --shards "$CI_BULK_SHARDS" \
            --threads "$CI_SHARD_THREADS" \
            --workdir "$RUNNER_TEMP/ci_parity" \
            $CHANGED_ARG

      # The sensitive lane runs AFTER the bulk lane and alone. Its reviewed
      # files are declared in tools.ci.sensitive: deadline and scheduler-ordering
      # witnesses must not compete with the bulk shards.
      # `if: always()` because a RED bulk lane must not HIDE the sensitive
      # lane's result. Run 32834492183 failed in bulk and skipped this step
      # entirely, so a whole class of evidence was silently absent from a run
      # that was supposed to produce the complete failure batch. Collecting
      # everything in ONE run is the rule this lane exists to enforce; a
      # workflow that stops at the first red step is the fix-one/rerun loop
      # wearing different clothes.
      - name: Unit tests — sensitive lane (serial, quiesced)
        if: always()
        env:
          CI_SHARD_THREADS: "1"
        run: |
          set -euo pipefail
          uv run python -m tools.ci sensitive \
            --root . \
            --threads "$CI_SHARD_THREADS" \
            --workdir "$RUNNER_TEMP/ci_parity"

      # Per-node JUnit is the structured evidence whole-run attribution needs,
      # and the current workflow emits none: `-q` prints counts, so skipped and
      # collected node identities never leave the runner. This is also what
      # answers CP-10 (12,992 collected locally vs 12,989 outcomes remotely) at
      # zero extra cost. `if: always()` because a RED run is exactly when the
      # per-node detail matters most.
      - name: Upload structured test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-parity-evidence
          # $RUNNER_TEMP, NOT the workspace: a workdir inside the checkout puts
          # every shard's TMPDIR in the repository, where one shard's fixture
          # becomes another shard's "repository content". Two failures in run
          # 32834492183 came from exactly that. The harness now refuses such a
          # workdir, so this path and that guard must stay in agreement.
          # EXACT paths, no `**`. Run 32834492183 uploaded 18,674 files of which
          # SIX were evidence: `**` descends into every shard's TMPDIR and
          # collected every JSON and XML any test happened to write in a
          # fixture. Worse, it matched no `shard*.log` at all — the tracebacks,
          # the single most useful artefact in a RED run, were the one thing
          # missing. These patterns name only what the harness itself writes.
          path: |
            ${{ runner.temp }}/ci_parity/*.json
            ${{ runner.temp }}/ci_parity/bulk/shard*.xml
            ${{ runner.temp }}/ci_parity/bulk/shard*.log
            ${{ runner.temp }}/ci_parity/sensitive/shard*.xml
            ${{ runner.temp }}/ci_parity/sensitive/shard*.log
          retention-days: 14
          # `.ci_parity` is dot-prefixed, and upload-artifact@v4 EXCLUDES hidden
          # paths by default — the first remote run uploaded nothing and logged
          # "No files were found", leaving a RED run with no per-node evidence
          # at all. The patterns above are scoped to *.xml / *.json under that
          # one directory, so this does not widen what is collected.
          include-hidden-files: true
          # An empty evidence artifact is a harness failure, not a warning: the
          # whole point of the upload is that a RED run stays attributable.
          if-no-files-found: error
