<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-label="Four quantities a run produces and who consumes each. The training objective feeds the optimiser. The primary metric drives model selection. Secondary metrics influence nothing and are evidence only. The health gate feeds the loop's control flow.">
  <defs>
    <marker id="bGrey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#95A5A6"/>
    </marker>
    <marker id="bOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#F39C12"/>
    </marker>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .k    { font-size: 13px; font-weight: 700; fill: #fff; letter-spacing: .3px; }
      .q    { font-size: 13px; font-style: italic; fill: #566573; }
      .c    { font-size: 12.5px; font-weight: 700; }
      .hdr  { font-size: 10px; font-weight: 700; fill: #95A5A6; letter-spacing: 1.2px; }
      .take { font-size: 15px; font-weight: 700; font-style: italic; fill: #C0392B; }
    </style>
  </defs>

  <rect width="960" height="382" fill="#ffffff"/>

  <text class="hdr" x="30"  y="44">THE QUANTITY</text>
  <text class="hdr" x="256" y="44">WHAT IT ANSWERS</text>
  <text class="hdr" x="688" y="44">WHO CONSUMES IT</text>
  <line x1="30" y1="54" x2="930" y2="54" stroke="#E5E8E8" stroke-width="1.5"/>

  <!-- row 1 — training objective -->
  <rect x="30" y="68" width="200" height="52" rx="9" fill="#E74C3C"/>
  <text class="k" x="130" y="99" text-anchor="middle">TRAINING OBJECTIVE</text>
  <text class="q" x="256" y="99">what optimisation minimises, batch by batch</text>
  <line x1="640" y1="94" x2="674" y2="94" stroke="#95A5A6" stroke-width="2" marker-end="url(#bGrey)"/>
  <rect x="686" y="68" width="244" height="52" rx="9" fill="#fff" stroke="#B2BABB" stroke-width="2"/>
  <text class="c" x="808" y="99" text-anchor="middle" fill="#7F8C8D">the optimiser</text>

  <!-- row 2 — primary metric (the one that decides) -->
  <rect x="30" y="134" width="200" height="52" rx="9" fill="#F39C12"/>
  <text class="k" x="130" y="158" text-anchor="middle">PRIMARY METRIC</text>
  <text x="130" y="174" text-anchor="middle" font-size="10" font-style="italic" fill="#fff" opacity=".9">the golden metric</text>
  <text class="q" x="256" y="165">how good is the finished model, scientifically?</text>
  <line x1="640" y1="160" x2="674" y2="160" stroke="#F39C12" stroke-width="2.5" marker-end="url(#bOrange)"/>
  <rect x="686" y="134" width="244" height="52" rx="9" fill="#F39C12"/>
  <text class="c" x="808" y="165" text-anchor="middle" fill="#fff">MODEL SELECTION</text>

  <!-- row 3 — secondary metrics (evidence only) -->
  <rect x="30" y="200" width="200" height="52" rx="9" fill="#7F8C8D"/>
  <text class="k" x="130" y="231" text-anchor="middle">SECONDARY METRICS</text>
  <text class="q" x="256" y="231">what else is worth knowing about this result</text>
  <line x1="640" y1="226" x2="674" y2="226" stroke="#95A5A6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#bGrey)"/>
  <rect x="686" y="200" width="244" height="52" rx="9" fill="#FBFCFC" stroke="#B2BABB" stroke-width="2" stroke-dasharray="6,5"/>
  <text class="c" x="808" y="222" text-anchor="middle" fill="#7F8C8D">evidence only —</text>
  <text class="c" x="808" y="239" text-anchor="middle" fill="#7F8C8D">it orders nothing</text>

  <!-- row 4 — health gate -->
  <rect x="30" y="266" width="200" height="52" rx="9" fill="#2C3E50"/>
  <text class="k" x="130" y="297" text-anchor="middle">HEALTH GATE</text>
  <text class="q" x="256" y="297">is this output valid enough to be worth trusting?</text>
  <line x1="640" y1="292" x2="674" y2="292" stroke="#95A5A6" stroke-width="2" marker-end="url(#bGrey)"/>
  <rect x="686" y="266" width="244" height="52" rx="9" fill="#fff" stroke="#2C3E50" stroke-width="2"/>
  <text class="c" x="808" y="297" text-anchor="middle" fill="#2C3E50">the loop's control flow</text>

  <text class="take" x="480" y="358" text-anchor="middle">Only the primary metric selects — and a gate PASS is not a scientific result.</text>
</svg>
