  # ---- Part 2 FINAL operator rulings, 2026-08-26 ----------------------------

  - decision_id: D-LLM-12
    parameter: API timeout and retry policy
    concept: 600s timeout; indefinite retry for transient; fail closed on deterministic
    status: FROZEN
    implementation_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    frozen_value:
      request_timeout_seconds: 600
      model_authority_on_retry: unchanged
      fallback_model: FORBIDDEN
      scientific_attempt_budget: >-
        must NOT be consumed merely because transport/API infrastructure
        temporarily failed
      retry_indefinitely:
        [429 rate limit, 5xx provider failures, connection failures,
         transient network failures, retryable timeout failures,
         temporary provider outages]
      fail_closed:
        [malformed request, unsupported parameter, invalid configuration,
         deterministic client programming error, permanently invalid credentials]
    audit_vs_policy:
      already_exact: [request timeout 600s, 429 indefinite, 5xx indefinite, deterministic 4xx fail-closed, model authority unchanged, fallback VERIFIED_DISABLED]
      gaps:
        - {class: connection failures, current: bounded at 3 attempts, required: indefinite}
        - {class: retryable timeout failures, current: bounded at 3 attempts, required: indefinite}
      unverified: {item: attempt budget not consumed by transport failure, finding: F-LLM-3}
    backoff_semantics_preserved:
      schedule: [2.5, 5, 10, 20, 40, 60]
      cap_seconds: 60.0
      initial_seconds: 2.5
      jitter: NONE
      sdk_retry: disabled (max_retries=0) — the bridge loop is the sole authority
      rate_limit_override: >-
        an API-supplied RetryInfo delay overrides the schedule for that attempt
        only; the next attempt resumes the normal schedule
      verdict: compatible with the frozen policy; retained unchanged
    implementation_constraint_for_the_implementer:
      finding_id: F-LLM-2
      note: >-
        The frozen policy says "RETRYABLE timeout failures", not all timeout
        failures. With the timeout frozen at 600s rather than raised, the
        2026-08-17 failure mode (a legitimate request longer than the client
        budget, retried forever, billing every attempt) is not structurally
        impossible. The implementation must distinguish a transient timeout
        from one that recurs identically at the same budget — the latter is
        deterministic with respect to that budget and must fail closed with an
        operator-visible message. Concrete risk case: proposer.proposing
        already carries a 151,459-token prompt and prompt size grows over a
        campaign.
      owner: release lane, routed through the Supervisor
    dependencies: [F-LLM-2, F-LLM-3]
