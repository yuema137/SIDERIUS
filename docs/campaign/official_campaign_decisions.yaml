  - decision_id: D-LIT-1
    parameter: literature review and TIDMAD prior isolation
    concept: symmetric capability, TIDMAD-specific prior excluded from BOTH arms
    status: FROZEN                     # the scientific intent
    implementation_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    frozen_value:
      intent: >-
        Literature review must NOT independently recover TIDMAD-specific prior
        information that belongs to the treatment. BOTH arms retain the SAME
        general literature-review capability, but TIDMAD-specific prior /
        official-baseline retrieval is excluded from that channel for BOTH arms.
      gold: receives TIDMAD prior ONLY through the frozen Part 1 treatment artifact
      blind: receives no TIDMAD prior through either direct injection or lit-review recovery
      prohibition: >-
        Do NOT solve this by giving blindpod a weaker literature-review
        capability than goldpod.
      excluded_information_classes:
        - official TIDMAD baseline results
        - historical baseline score
        - historical per-file result vector
        - official baseline HealthGate / health-check result
        - exact historical baseline architecture / recipe
        - other TIDMAD-specific prior evidence materially reproducing the Part 1 treatment
    audit_of_current_path:
      whether_it_runs: >-
        Available on the formal path; ships enabled:false; priority CLI > YAML >
        False. launch_prior_baseline_experiment.sh turns it ON for the WITH arm,
        explicitly OFF for the WITHOUT arm.
      when: workflows/model_exploration.py:2634 — inside the iteration loop, after interpretation, before proposal
      how_often: >-
        EVERY iteration, unconditionally. The gate is `del interp_output;
        return enabled` — content-based gating declared "reserved for future"
        and not implemented. No cadence control exists.
      provider_model: deepseek / deepseek-v4-pro for both sub-slots — the only non-OpenAI authority, and a mutable alias (D-PROV-1)
      search_mechanism: >-
        Semantic Scholar Graph API https://api.semanticscholar.org/graph/v1;
        >=1.1s throttle; S2_MAX_RETRIES=3; per-process cache
      query_generation: >-
        LLM-authored. The search-decision call emits queries anchored on the
        task description resolved from configs/task_config.yaml — i.e. from the
        TIDMAD task statement itself.
      corpus_scope: all of Semantic Scholar; max_rounds 3, results_per_query 10, escalation_allowed true, max_escalations_per_round 2
      reaches_proposer:
        - {channel: findings -> expert_context, crosses: true, note: synthesised; equations and pseudocode inline in content}
        - {channel: agent_card -> agent_cards, crosses: true}
        - {channel: new_vocab_candidates -> vocab_seed, crosses: true, note: EMPTY in v1}
        - {channel: suggested_mindset -> mindset, crosses: true, note: EMPTY in v1}
        - {channel: retrieved_papers, crosses: false, note: audit-trail only, explicitly never crosses the edge}
      can_recover_tidmad_prior_today: >-
        YES — directly and by configuration. configs/lit_review_config.yaml
        declares root_papers arxiv 2406.04378 (THE TIDMAD PRIMARY PAPER) at
        verbosity 1 (full PaperExtract), resolved at agent start on EVERY
        iteration, delivering official baseline architectures, reported scores
        and training setup into synthesis and thence into expert_context.
    enforcement_problem:
      mechanism_exists: false
      evidence: >-
        No denylist / blocklist / exclusion mechanism exists in
        agent/skills/paper_resolver_skill/ or nodes/ml_literature_review/. A
        repo-wide search for denylist/deny_list/blocklist/exclude/forbidden
        across both returns nothing relevant.
      problem_1:
        name: the root paper
        difficulty: EASY — config only
        fix: remove the 2406.04378 entry from root_papers; closes the deterministic guaranteed delivery
      problem_2:
        name: dynamic search rediscovery
        difficulty: HARD — the honest blocker
        why: >-
          Queries are LLM-authored FROM THE TIDMAD TASK DESCRIPTION and the
          corpus is all of Semantic Scholar. A search anchored on broadband
          signal denoising / axion detection / SQUID time series is reasonably
          likely to surface the TIDMAD paper on its own merits — that is the
          search working correctly. Removing it from root_papers does not stop
          the search finding it.
        required_capability: >-
          An exclusion enforced at the PAPER-RESOLUTION BOUNDARY — a
          campaign-level identifier denylist (arXiv id, S2 paper id, DOI, title
          match) applied to EVERY resolution path (root papers, search hits,
          escalations), each refusal recorded so the exclusion is auditable.
          Symmetric by construction: same denylist both arms, so capability
          stays identical and only the corpus is trimmed.
      residual_limitation: >-
        An identifier denylist cannot exclude a DIFFERENT paper that restates
        TIDMAD's baseline numbers — a survey, a citing work, a successor.
        Exclusion by identifier is enforceable and auditable; exclusion by
        SEMANTIC CONTENT is not, without a judgement layer that would itself
        become an unreviewed campaign variable. Achievable guarantee: no
        TIDMAD-IDENTIFIED SOURCE reaches either arm, NOT that no TIDMAD-derived
        fact can possibly appear.
    disposition:
      scientific_intent: FROZEN
      enabled_state_for_the_formal_campaign: PENDING_OPERATOR_DECISION
      enabled_state_note: >-
        The frozen intent (both arms keep the capability) implies ON in both.
        The shipped default is OFF in both, and the shipped launcher makes it
        the arm variable. This needs an explicit ruling.
      root_paper_removal: PENDING_IMPLEMENTATION (config-only)
      resolution_boundary_denylist: PENDING_IMPLEMENTATION (NEW capability)
      root_papers_cache: >-
        PENDING_IMPLEMENTATION — the cold-start checklist RETAINS this cache by
        default; if it holds a TIDMAD extract from a prior run, config removal
        does NOT evict it. Must be cleared for the formal campaign.
      semantic_restatement_residue: accepted limitation, to be stated in the campaign manifest
    dependencies: [D-PROV-1, D-COLD-1]
    operator_input_required: true
    last_updated: 2026-08-26

  - decision_id: D-COLD-1
    parameter: cold-start authority
    concept: both arms start from a true cold campaign state; gold adds only the treatment seed
    status: FROZEN
    implementation_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    frozen_value:
      blindpod: cold execution state + NO treatment information seed
      goldpod: cold execution state + the frozen Part 1 treatment information seed
      terminology_binding: >-
        "goldpod is seeded" means TREATMENT-seeded through the Part 1
        information artifacts. It does NOT mean pretrained-weight warm start,
        checkpoint warm start, inherited research-memory state, or inherited
        previous-campaign state. Those remain excluded from BOTH arms unless
        the operator explicitly reopens Part 1.
      neither_arm_may_inherit:
        - prior TIDMAD baseline information
        - prior campaign research memory
        - prior proposal / tuning history
        - prior run artifacts
        - persisted scientific conclusions
        - prior plugins / models created by an earlier campaign run
        - treatment artifacts (blindpod)
        - warm-start checkpoints / weights
    existing_authority:
      document: docs/gates/gate_testing_standard.md — "Partial-scope rules", cold-start checklist (arXiv U3, #259)
      principle: >-
        Cold start is MORE than omitting --seed_paths: several caches survive a
        fresh workspace and silently carry evidence or capability between runs.
      checklist:
        - {n: 1, state: chain workspace (--workspace DIR), action: CLEAR, campaign_note: operator MANUAL pre-launch step}
        - {n: 2, state: --seed_paths, action: OMIT, campaign_note: launcher already refuses}
        - {n: 3, state: "agent_generated/models/ + _capability_index.json", action: CLEAR, campaign_note: operator MANUAL pre-launch step}
        - {n: 4, state: "${SIDERIUS_CHAIN_WORKSPACE}/plugins/", action: cleared by step 1, campaign_note: null}
        - {n: 5, state: reference_data/root_papers_cache/, action: RETAIN by default, campaign_note: "MUST BE CLEARED for this campaign — can hold a TIDMAD extract that config removal does not evict (D-LIT-1)"}
        - {n: 6, state: runtime-calibration store ($SIDERIUS_CALIBRATION_DIR), action: RETAIN, campaign_note: host calibration not task evidence — consistent with cold SCIENTIFIC state}
        - {n: 7, state: advice file (--advice / --human_advice_file), action: OMIT, campaign_note: "COLLIDES with Part 1 — goldpod's treatment IS an advice-shaped artifact; T-IMPL-1"}
    findings:
      - >-
        Items 1 and 3 are MANUAL operator pre-launch steps; the launcher does
        not perform them. For a two-arm campaign they must be performed
        identically and verifiably on both pods, which argues for a recorded
        preflight row rather than a remembered habit. PENDING_IMPLEMENTATION.
      - >-
        Item 5's default (RETAIN) must be OVERRIDDEN for this campaign. Its
        reasoning — root-paper extracts are deterministic inputs, not run
        evidence — no longer holds for the TIDMAD extract under D-LIT-1.
      - >-
        Item 7 is the Part 1 collision tracked as T-IMPL-1. Reconciled by the
        artifact being a FROZEN CONTENT-HASHED CAMPAIGN INPUT rather than an
        operator-authored run hint — but the launcher's blanket refusal must
        change for goldpod and stay in force for blindpod.
      - >-
        NOT YET ESTABLISHED: whether other persisted scientific state
        (interpreter prediction pools, vocab_link_confirmations, accumulated
        key findings, per-file-best tables, promotion/calibration provenance)
        survives a fresh workspace. The checklist does not enumerate them.
        PENDING_AUDIT — deferred to the audit register.
    dependencies: [D-LIT-1, T-IMPL-1]
    last_updated: 2026-08-26

