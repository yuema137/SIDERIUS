  - decision_id: D-LLM-13
    parameter: model snapshot pinning
    concept: pin immutable snapshots wherever the provider exposes one
    status: FROZEN
    implementation_status: PENDING_IMPLEMENTATION
    disposition_2026_08_26:
      release_blocking: false
      gold_launch_precondition: true
      statement: >-
        NOT a v0.1.0 release blocker — it does not gate the code release. It
        GATES LAUNCHING A CAMPAIGN WHOSE OWN INTERNAL COMPARISONS ARE MEANT TO
        MEAN SOMETHING.
      correction_history:
        - >-
          FIRST this lane called it "the ONLY remaining defence against a
          provider-side model change between the two arms" and asked for
          release-blocking treatment. Under Gold-only that rested on a
          comparison the campaign is not making. WITHDRAWN.
        - >-
          SECOND this lane proposed demoting it to provenance hygiene. Too far
          in the other direction. The Supervisor supplied the stronger residual
          argument, adopted below.
      residual_argument: >-
        Gold runs four bands x up to 20 iterations, concurrently, potentially
        over days, against a MUTABLE ALIAS. A provider update mid-campaign means
        different bands, or different iterations of the SAME band, execute
        against different models. An INTRA-GOLD internal-comparability defect
        that would exist even if Blind had never been designed.
      NOT_contaminated_by_alias_drift:
        - Golden Metric arithmetic and HealthGate verdicts — they measure a trained model, not the proposer
        - Composed Best pooling — one score_vector call over four already-selected deliverables
        - Strict Best comparison — four FIXED DESIGNS retrained under identical frozen authority, NO proposer involved
      contaminated_by_alias_drift:
        - the candidate POOL those selections draw from
        - the official iteration trajectory D-SCORE-7 — THE SHARPEST INSTANCE
        - the campaign's central scientific claim
      sharpest_instance: >-
        NOT cross-band but WITHIN-BAND. D-SCORE-7 freezes the headline artifact
        as "cumulative best HealthGate-valid FORMAL Golden Metric by iteration",
        read as ONE AGENT'S PROGRESS over 20 iterations. If iterations 3 and 17
        of the same band ran against different models the curve silently plots
        TWO AGENTS and is presented as one. Correct scoring arithmetic does not
        repair it — the defect is in what the x-axis MEANS.
      two_parts_2026_08_26:
        note: >-
          Supervisor mechanical verification, independently re-verified by this
          lane. The pin has TWO halves and the second is what makes the first
          checkable.
        a_pin_the_config:
          what: 8 strings in llm_configs/openai_tiered_pro.json
          cost: trivial, config only
        b_capture_the_resolved_model:
          what: capture response.model into provenance
          cost: small, localized, in agent/llm_bridge.py
          why_required: >-
            grep 'response.model | resolved_model' over agent/llm_bridge.py
            returns NOTHING. _record_usage stores the CONFIGURED model_name
            passed by the caller, and a real persisted row reads
            "model": "gpt-5.5" — the ALIAS — while a live probe of the same
            request shape returns gpt-5.5-2026-04-23, the SNAPSHOT. The provider
            returns the resolved model on every call and SIDERIUS DISCARDS IT.
          the_precise_defect: >-
            After the config pin the persisted record would read
            gpt-5.5-2026-04-23 — but that is the CONFIGURED value being echoed
            back, not the SERVED model being observed. If the provider served
            something else the record would read EXACTLY THE SAME. A provenance
            field that records what you asked for rather than what you got
            cannot discriminate between the two cases, so it CAN NEVER FAIL —
            and by the campaign's own anti-vacuity rule a check that cannot fail
            is not a check.
          not_scope_creep: >-
            A pin nobody can check is precisely the stated-versus-effective gap
            the review gate exists to eliminate. It would arrive in the section-4
            table as a VERIFIED row that was really a STATED one.
      the_class_this_belongs_to: >-
        ANY provenance field that ECHOES CONFIGURATION rather than CAPTURING
        OBSERVATION has this property. The distinction is already visible in the
        section-4 table: row 62's config sha256 is an OBSERVATION, computed from
        the file's bytes, so it fails if the file changes. Row 66b's model
        identity must be an observation too. Section 11's adversarial witnesses
        should test the CLASS, not just this instance.
      latent_not_live_recorded_without_expanding_scope: >-
        agent/llm_bridge.py:443-444 — "if model_id is None and known: model_id =
        known['default_model']" — and openai's default is gpt-4o, not merely a
        mutable alias but a DIFFERENT MODEL, substituted silently with no
        warning. UNREACHABLE on any campaign path because the routing file
        supplies model_id for all 10 roles and the only no-model_id
        constructions are in env_validation/. Becomes live only if a role is
        ever added without a model_id.
      cost: (a) eight strings in one file · (b) a small localized bridge change
    control_class: EXPERIMENT_FIXED
    frozen_value:
      policy: >-
        Formal campaign model authorities must be pinned to immutable model
        snapshots/revisions wherever the provider exposes such an authority. A
        mutable alias must not be used when an immutable snapshot is available.
      openai:
        provider: openai
        configured_alias: gpt-5.5
        immutable_snapshot: gpt-5.5-2026-04-23
        mapping_verified: >-
          live models endpoint AND the model field of 5 actual completion
          responses, all agreeing
        minimal_config_change:
          file: llm_configs/openai_tiered_pro.json
          change: >-
            8 occurrences of "model_id": "gpt-5.5" become
            "model_id": "gpt-5.5-2026-04-23"
          slots: [interpret, propose.comparison, propose.reasoning, propose.proposing, implement, validate, tune.planner, tune.reflector]
          code_change_required: none
          side_effect: >-
            the file sha256 changes; D-LLM-1's recorded hash must be updated in
            the same change
        status: PENDING_IMPLEMENTATION
    operator_confirmation_owed:
      question: gpt-5.5 vs gpt-5.5-pro
      detail: >-
        The config is named openai_tiered_pro.json and has been called "the
        OpenAI Pro config", but it pins gpt-5.5, NOT gpt-5.5-pro. The _pro
        denotes the config TIER (frontier routing file vs certify_minimal.json),
        not the -pro model variant. A separate gpt-5.5-pro /
        gpt-5.5-pro-2026-04-23 pair exists in the account. Pinning the wrong
        family would freeze a mistake.
      status: PENDING_OPERATOR_DECISION
    dependencies: [D-LLM-1, D-PROV-1]
    last_updated: 2026-08-26

