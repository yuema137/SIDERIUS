  - decision_id: D-COLD-1
    parameter: cold-start authority
    concept: both arms start from a true cold campaign state; gold adds only the treatment seed
    status: FROZEN
    implementation_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    frozen_value:
      blindpod: cold execution state + NO treatment information seed
      goldpod: cold execution state + the frozen Part 1 treatment information seed
      terminology_binding: >-
        "goldpod is seeded" means TREATMENT-seeded through the Part 1
        information artifacts. It does NOT mean pretrained-weight warm start,
        checkpoint warm start, inherited research-memory state, or inherited
        previous-campaign state. Those remain excluded from BOTH arms unless
        the operator explicitly reopens Part 1.
      neither_arm_may_inherit:
        - prior TIDMAD baseline information
        - prior campaign research memory
        - prior proposal / tuning history
        - prior run artifacts
        - persisted scientific conclusions
        - prior plugins / models created by an earlier campaign run
        - treatment artifacts (blindpod)
        - warm-start checkpoints / weights
    existing_authority:
      document: docs/gates/gate_testing_standard.md — "Partial-scope rules", cold-start checklist (arXiv U3, #259)
      principle: >-
        Cold start is MORE than omitting --seed_paths: several caches survive a
        fresh workspace and silently carry evidence or capability between runs.
      checklist:
        - {n: 1, state: chain workspace (--workspace DIR), action: CLEAR, campaign_note: operator MANUAL pre-launch step}
        - {n: 2, state: --seed_paths, action: OMIT, campaign_note: launcher already refuses}
        - {n: 3, state: "agent_generated/models/ + _capability_index.json", action: CLEAR, campaign_note: operator MANUAL pre-launch step}
        - {n: 4, state: "${SIDERIUS_CHAIN_WORKSPACE}/plugins/", action: cleared by step 1, campaign_note: null}
        - {n: 5, state: reference_data/root_papers_cache/, action: RETAIN by default, campaign_note: "MUST BE CLEARED for this campaign — can hold a TIDMAD extract that config removal does not evict (D-LIT-1)"}
        - {n: 6, state: runtime-calibration store ($SIDERIUS_CALIBRATION_DIR), action: RETAIN, campaign_note: host calibration not task evidence — consistent with cold SCIENTIFIC state}
        - {n: 7, state: advice file (--advice / --human_advice_file), action: OMIT, campaign_note: "COLLIDES with Part 1 — goldpod's treatment IS an advice-shaped artifact; T-IMPL-1"}
    findings:
      - >-
        Items 1 and 3 are MANUAL operator pre-launch steps; the launcher does
        not perform them. For a two-arm campaign they must be performed
        identically and verifiably on both pods, which argues for a recorded
        preflight row rather than a remembered habit. PENDING_IMPLEMENTATION.
      - >-
        Item 5's default (RETAIN) must be OVERRIDDEN for this campaign. Its
        reasoning — root-paper extracts are deterministic inputs, not run
        evidence — no longer holds for the TIDMAD extract under D-LIT-1.
      - >-
        Item 7 is the Part 1 collision tracked as T-IMPL-1. Reconciled by the
        artifact being a FROZEN CONTENT-HASHED CAMPAIGN INPUT rather than an
        operator-authored run hint — but the launcher's blanket refusal must
        change for goldpod and stay in force for blindpod.
      - >-
        NOT YET ESTABLISHED: whether other persisted scientific state
        (interpreter prediction pools, vocab_link_confirmations, accumulated
        key findings, per-file-best tables, promotion/calibration provenance)
        survives a fresh workspace. The checklist does not enumerate them.
        PENDING_AUDIT — deferred to the audit register.
    dependencies: [D-LIT-1, T-IMPL-1]
    last_updated: 2026-08-26

