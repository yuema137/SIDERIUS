      carried the ruling and stayed OPEN.
    claim_type: SOURCE_FACT
    finding: >-
      agent/schemas/training_diagnosis.py:55-57 - _trend returns "single_point"
      whenever len(series) < 2. At epochs_completed == 1 both the training and
      validation series have length 1, so train_trend and validation_trend are
      both single_point, validation_first == validation_last ==
      validation_min, best_validation_epoch = 0,
      final_vs_best_validation_degradation = 0.0, and
      validation_degraded_after_best CANNOT BE TRUE. 64 of 106 real histories
