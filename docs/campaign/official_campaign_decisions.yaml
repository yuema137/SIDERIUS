      mixed top score survives at :766 under "raw_best_score", the name that
      says what it is. :3278-3282 renames the operator's console line "Best
      score" -> "Formal best", which is where the defect was actually READ - a
      trial-only iteration used to announce a trial number under the word
      COMPLETE. :834 stamps manifest["formal_evidence"] from a new SHARED role
      authority (core/record_role.py:145 formal_evidence_of) on EVERY branch,
      including crashed and record-less ones, because an all-zero posture is the
      honest way to say no formal evidence was produced. WHAT IS DELIBERATELY
      UNCHANGED, and it is the row's own point: "status" still derives from the
      MIXED score (:756-757), and the in-source comment now states why - the
      manifest status vocabulary is FROZEN at completed|failed|no_records by
      stage_artifact_contract.md section 1, and it is the token core/resume.py,
      stage 3 and the inspector branch on. A trial-only iteration DID produce a
      consumable run_output. So "completed" is re-labelled as CHAINABILITY and
      the scientific question is answered beside it, rather than by overloading
      a frozen token. This row was recorded as a REPORTING defect and it is
      repaired as one; the selection path (core/resume.py:269,
      model_exploration.py) was already honest and is untouched.
    claim_type: SOURCE_FACT
    historical_event: >-
      All ten v20 attempt-3 manifests read best_valid_formal_score null,
      raw_best_formal_score null, result_authority "scientific", and best_score
      between 0.479 and 10.708 - every one a TRIAL score. Seven success records,
      all is_trial true, zero formal.
    mechanism: >-
      run_one_iteration.py:612-618 derives BOTH status and best_score from
      tune_output.best_denoising_score, which is top_record over ALL records
      (records.py:967-968), trial and formal mixed. The honest fields
      best_formal_denoising_score and best_valid_formal_denoising_score
      (records.py:969-979) exist and decide nothing here.
      inspect_run_state.py:200,422 renders the same mixed value as the
      operator's best_score column.
    the_important_nuance: >-
