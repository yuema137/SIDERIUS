  - decision_id: A-HOST-1
    parameter: four-band host-side contention witness
    status: PENDING_HARDWARE_EVIDENCE
    control_class: HARDWARE_DERIVED
    finding: >-
      On the Gold pod the GPUs are EXCLUSIVE but the four bands SHARE host CPU,
      RAM and filesystem. The unexplained 2.389x dual-coresidency multiplier
      occurred at 7-20% GPU utilization and 82-90% CPU idle and was never
      mechanistically explained — the host layer is where it most plausibly
      lives.
    purpose_restated_2026_08_26: >-
      QUALIFY THE GOLD EXECUTION ENVIRONMENT AND DETECT RESOURCE-SELECTION
      DISTORTION — not "prove simultaneous-arm symmetry". The row is NOT
      weakened by the Gold-only ruling; the unresolved 2.389x remains a
      legitimate engineering question.
    required_measurements:
      - baseline host load BEFORE each witness
      - one-band vs four-band runtime
      - per-GPU utilization
      - CPU / loadavg
      - I/O wait
      - DataLoader observables
      - concurrent UNRELATED host load, so a neighbour's activity is never mistaken for our own four-band contention
    why_it_is_not_a_formality: >-
      This is where that open question lands, now with FOUR processes instead of
      two. Exclusive GPU residency does not remove host contention, and the
      original measurement's low GPU utilization suggests GPU contention was
      never the cause.
    consequence_for_F_CONFOUND_1: >-
      Directly forced the correction recorded on F-CONFOUND-1: multiplier 1 is
      UNKNOWN and possibly LARGER at four processes, not GONE.
    THE_HOST_IS_SHARED_2026_08_26:
      measurement: >-
        Gold pod baseline with NOTHING of ours running: loadavg
        60.17 / 59.00 / 56.23 on 224 cores — about 27% of the host CPU already
        consumed by OTHER TENANTS.
      testpod_comparison: exp1 baseline ~50 on 208 cores, about 24% — the same order
      binding_requirement: >-
        A-HOST-1 MUST record CONCURRENT BASELINE LOAD alongside every
        measurement. A single-band-vs-four-band comparison on a shared host
        measures our contention PLUS a neighbour's, and the neighbour's load is
        not controlled by us. A four-band slowdown CANNOT be attributed to our
        own concurrency without that record.
      why_this_matters_methodologically: >-
        Without the baseline record we would repeat exactly the error this lane
        already retracted on F-CONFOUND-1 — attributing an effect to a mechanism
        nobody established.
      open_hypothesis_not_a_claim: >-
        Neighbour load is now a LIVE CANDIDATE for part of the unexplained
        2.389x. The hypothesis could not have been formed before a second host's
        baseline existed. A-HOST-1 can now rule it in or out.
