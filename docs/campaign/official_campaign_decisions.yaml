  - decision_id: F-SCANB-2
    parameter: a correct VRAM rejection crashes the loop and consumes an attempt
    concept: R3 - the explicit-truncation marker kills its own consumer
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    reconciled: >-
      DISCHARGED 2026-08-27 by ledger reconciliation, not by new work. Landed as
      f2d7ae3d (PR #339), which names this row in its own title and is a
      verified ancestor of origin/master 3995400b. Verified on master: the
      crashing expression the row quotes - resource_check.get("memory_killer")
      or {} followed by .get - no longer exists in production; the only
      surviving occurrences are this ledger, the review package and the
      regression witness that asserts it must not come back. execution.py:203
      declares _structured_mapping(value) -> dict[str, Any], mapping every
      non-dict member of the union (the truncation-marker STRING and None
      alike) to {}, and :443 routes memory_killer through it; :228 is the
      violations twin. The fix is on the CONSUMER side, so the deliberate
      explicit-rather-than-silent truncation marker the row defends is
      preserved rather than narrowed away - which was the row's whole point.
    claim_type: SOURCE_FACT
    raised: 2026-08-26
    historical_event: >-
      Twice - v20 attempts 1 and 3. "Verdict: OVER-BUDGET (VRAM) - estimated
      18.7 GB > cap 12.0 GB" followed by "Loop Error: 'str' object has no
      attribute 'get'". The record carries failure_type AttributeError and
      counts_toward_attempt_budget true.
    mechanism_verified: >-
      nodes/ml_hyperparameter_tune_agent/execution.py:404-405 does
      _killer = resource_check.get("memory_killer") or {} and then
      _killer.get("binding_cap", "vram"). A truthy str survives "or {}" and
      raises AttributeError.
    why_a_str_reaches_it: >-
      agent/skills/evaluate_vram_skill/isolated_probe.py:342 declares
      memory_killer as dict[str, Any] | str | None, and :334-341 states the
      reason VERBATIM: "str is a real member of each union, not sloppiness: when
      a field will not fit the 8 KiB budget the worker replaces it with
      '[dropped: exceeded the rich-field budget]' so its absence is EXPLICIT
      RATHER THAN SILENT. Narrowing these to list/dict would turn that
      deliberate marker back into a silent None." And _dict_or_none (:683-684)
      DELIBERATELY preserves it: "value if isinstance(value, (dict, str)) else
      None".
    the_irony_is_the_finding: >-
      A mechanism built so that truncation is EXPLICIT RATHER THAN SILENT
      crashes the consumer that was supposed to read it. The marker saying "this
      data was dropped" is what kills the round. And it fires on a CORRECT
      resource rejection - the system is at its most right precisely when it
      breaks.
    campaign_consequence: >-
      A correct VRAM refusal spends a scientific attempt and ends the round with
      an AttributeError rather than an admission record. Under a 4-way H100
      posture where large candidates are expected to be refused, this is not a
      rare path.
    dependencies: [D-FAIL-1, D-FAIL-5]
    last_updated: 2026-08-26

