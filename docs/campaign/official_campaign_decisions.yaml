    audit_result_A2_FCNET:
      finding: >-
        The confirmation has run and returns a BLOCKER rather than a value.
      fcnet_reference_construction: >-
        The FCNet paper reproduction is FOUR band-split checkpoints
        (FCNet_0_4.pth, FCNet_4_10.pth, FCNet_10_15.pth, FCNet_15_20.pth) whose
        deliverables are POOLED and scored in ONE score_vector call over all 20
        files (scripts/score_tidmad_official_banded.py;
        docs/design/paper_and_collapse_reference_baselines.md section 2.1).
      consequence: the recorded FCNet reference is a FULL-SCOPE (0..19) scalar
      per_band_fcnet_score_exists: false
      what_the_artifacts_do_carry:
        - unique_int8, std_mv, mode_fraction, pearson (diversity metrics)
        - fcnet_reference_params = 323000000
        - NOT a per-band denoising_score
      why_it_blocks: >-
        A campaign band's formal score is a BAND-SCOPE scalar. FCNet's reference
        is a FULL-SCOPE scalar. Under the standing invariant that aggregate
        scalars are only comparable within one scope, "band beats FCNet + 2" is
        NOT COMPUTABLE today, and scoring_utils section 3 forbids deriving one
        from the other by any averaging.
      resolution_using_only_the_sanctioned_construction: >-
        The FCNet deliverables are preserved at
        /home/klz/Data/SIDEREIS_DATA/tidmad_reproduction/fcnet/full_20_files/.
        Four per-band FCNet reference scores can be produced by calling
        score_vector on a SCOPED SampleSet per band — explicitly the
        construction scoring_utils section 3 sanctions ("or call score_vector on
        a scoped SampleSet"). No new aggregation rule, no new authority.
    interim_behaviour: >-
      Until the four per-band references are produced and recorded, a band runs
      its full 20-iteration horizon.
    operator_input_required: true
    open_question: >-
      Whether "+2" is measured against a PER-BAND FCNet reference (the only
      comparable form, giving a band-local stop) or against the FULL-SCOPE FCNet
      reference applied to the composed-best result (D-BEST-1), which would be a
      CAMPAIGN-TERMINAL stop rather than a band-local one. These are different
      rules with different stopping behaviour and the choice is not assumed.
    dependencies: [D-BUD-2, D-BEST-1, D-SCORE-1, A2-FCNET]
    last_updated: 2026-08-26

