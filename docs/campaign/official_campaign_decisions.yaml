  - decision_id: F-N5
    parameter: a blank `aggregation:` passes the validator and suppresses the framework default
    concept: present to the composer, absent to the validator
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    claim_type: SOURCE_FACT
    raised: 2026-08-27
    authority: blinded adversarial review (N-5); verified in this lane against merged source
    finding: >-
      YAML "aggregation:" with no value parses to None. The validator read
      value.get("aggregation") and early-returned on None (ACCEPTED IN
      SILENCE), while _composition.compose_gate decides declarability on
      PRESENCE - TASK_DECLARABLE_POLICY_KEYS & entry.parameters.keys() - so the
      blank key was a DECLARATION to the composer and the framework default was
      withheld. The three consuming checks read cfg.get("aggregation",
      DEFAULT), and a present None defeats a fallback.
    reconciled: >-
      DISCHARGED 2026-08-27. Landed as 8bd08b4a (PR #365), a verified ancestor
      of this branch; the ledger was not touched by it. Verified on merged
      source at execute_tools/health_checks/_task_health_config.py: the
      validator now tests PRESENCE the same way the composer does ("aggregation"
      not in value) and REFUSES a declared-but-valueless key rather than
      accepting it, so the validator and the composer can no longer disagree
      about whether a key is declared. The refusal message names the YAML
      behaviour explicitly, which matters because the surface reads as an
      omission to whoever wrote it.
    interaction_with_F_SCAND_2: >-
      CROSS-REFERENCE, NOT A STATUS CHANGE, and it was checked rather than
      assumed - two adjacent changes to one key are not independent by default.
      F-SCAND-2's corrected header asserts "the framework's value is a DEFAULT
      and a roster entry MAY declare its own". That is true for
      PRESENT-WITH-A-VALUE and for ABSENT, and silently FALSE for the third
      state, PRESENT-AND-BLANK. N-5 is a hole in the very mechanism
      F-SCAND-2's discharge certified. THE DISCHARGE DOES NOT REOPEN: it
      claimed declarability works and that the header sentence is now true, and
      both remain so. What it did not do is enumerate the third state. A
      DISCHARGE CERTIFIES THE CLAIM IT MADE, NOT THE MECHANISM'S WHOLE STATE
      SPACE.
    no_fingerprint_move_measured_2026_08_27: >-
      Checked BEFORE this row was written, because F-SCAND-2's discharge had
      just taken a deliberate TIDMAD composition-fingerprint move
      (9b497798... -> c0102089...) whose accepted consequence is that
      pre-b0a04e04 composed workspaces fail their resume CLOSED. A second move
      would compound that. Measured against #365's actual 15-file diff:
      configs/task_health/tidmad.yaml is NOT among them; TIDMAD's roster
      declares NO aggregation key at all (its only occurrence in that file is
      the header comment), so the new refusal cannot fire on it; and
      _composition.py's change in that PR is docstring-only. No second move.
    dependencies: [F-SCAND-2]
    last_updated: 2026-08-27

