  - decision_id: F-CONFOUND-1
    parameter: treatment-correlated ceiling confound — RE-DERIVED under exclusive residency
    status: PENDING_HARDWARE_EVIDENCE
    control_class: EXPERIMENT_FIXED
    withdrawn: false
    re_derivation_2026_08_26:
      instruction: Supervisor asked for re-derivation, not deletion. Direction unchanged; magnitude now unknown.
      multiplier_1_coresidency:
        was: 2.389x wall-time penalty at dual residency
        first_re_derivation_2026_08_26: "GONE — exclusive single-band residency removes it"
        CORRECTED_2026_08_26: >-
          NOT GONE. UNKNOWN, and possibly LARGER. The correction: exclusive
          residency removes GPU contention, but the measured 2.389x occurred at
          7-20% GPU utilization with 82-90% CPU idle — so GPU contention was
          almost certainly NOT its cause. The mechanism was never explained, and
          the host layer (shared CPU, RAM, filesystem) is where it most
          plausibly lives. On the Gold pod the four bands have EXCLUSIVE GPUs but
          SHARE one host. Process count therefore rises 2 -> 4 on exactly the
          layer that was never ruled out. The first re-derivation removed a
          multiplier on the strength of a mechanism nobody had established.
        status: UNKNOWN — pending the four-band host-side witness
        corrected_by: Supervisor observation, 2026-08-26
      multiplier_2_trial_data:
        status: UNCHANGED — post-#320 trial rounds use the true frozen 1% scope, ~5x the pre-fix ~0.2%
      multiplier_3_model_scale:
        was: goldpod advice encourages 10M-500M against v20's realized 0.9M-25.9M, under a 36GB ceiling
        now: LARGER — the 60GB ceiling permits materially bigger candidates than when the analysis was done
      net_CORRECTED: >-
        Zero multipliers safely removed, one unchanged, one INCREASED, and one
        UNKNOWN that may be larger at four processes than it was at two. The
        confound's direction is unchanged and it remains TREATMENT-CORRELATED.
        Its magnitude is unknown and the earlier claim that it had SHRUNK was
        premature.
      new_mechanism_identified:
        name: admission / completion envelope gap
        finding: >-
          Raising the VRAM ceiling 36 -> 60GB WITHOUT raising the time ceilings
          widens the gap between what is ADMISSIBLE and what is COMPLETABLE.
          Admission checks VRAM; the time gate checks predicted time. A
          candidate can pass VRAM admission at 60GB and then breach the 30-min
          trial ceiling — which D-FAIL-4 classifies as SCIENTIFIC /
          RESOURCE_INFEASIBLE and which therefore CONSUMES a scientific attempt.
        why_it_matters: >-
          The agent is now permitted to build candidates the clock cannot
          finish, and each such candidate costs a scientific attempt rather than
          being refused cheaply at admission. That is the same selection
          pressure as the original confound, arriving through a second door.
        treatment_correlation: >-
          goldpod's advice is what pushes toward the larger candidates the 60GB
          ceiling now permits, so this door also opens preferentially for
          goldpod.
    resolution_path:
      - A4-5 post-f310a264 evaluation-runtime witness, sized at the advice-encouraged scale
      - D-HW-7 exclusive-H100 single-resident time-ceiling qualification
    escalation_status: escalated to the operator by the Supervisor, 2026-08-26
    dependencies: [D-HW-6, D-HW-7, D-FAIL-4, A4-5]
    last_updated: 2026-08-26

