  - decision_id: F-METRIC-ID-1
    parameter: per_file_best.json stamps TIDMAD's metric identity for every task
    concept: the module resolved the run's true identity and then discarded it
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    claim_type: SOURCE_FACT
    raised: 2026-08-27
    authority: authority-reconciliation lane, verified against origin/master d2c12ebe
    finding: >-
      execute_tools/per_file_best.py:391 writes '"metric_id": TIDMAD_METRIC_ID'
      as a HARDCODED LITERAL into the artifact dict, for every task. The module
      is generic - it is the per-file-best table any run produces - so a
      composed run publishes an artifact asserting a metric identity that is not
      its own.
    why_it_is_not_a_cosmetic_label: >-
      The identity travels WITH the numbers. A composed California-housing run
      scores mae under direction lower; its per_file_best.json claims
      tidmad_denoising_score, whose direction is higher and whose scale is a
      log-space TIDMAD score. Any consumer that reads the artifact's own
      declared identity - to order rows, to pick a headline, or to build a paper
      table - is told the wrong direction for the numbers beside it. This is the
      C-P56-1 shape (implicit TIDMAD semantics reaching a composed run) in a
      persisted artifact rather than in a prompt.
    the_sharp_edge: >-
      The module ALREADY HAD the true identity and threw it away. _table_order()
      at :495-536 offers both declared sources - each iteration's stamped
      MetricSpec and each scored record's persisted metric_result - to
      reconcile_metric_identity at :535, precisely so rows are never ranked
      across incomparable metrics, and then returns only MetricOrder(reconciled),
      discarding the identity it just proved. The correct value was resolved a
      few lines above the literal that contradicts it.
    why_the_existing_guard_did_not_catch_it: >-
      The Step-09a executable census pins which production modules may DERIVE
      the TIDMAD metric spec, and this module correctly derives nothing - an
      earlier draft's derive_tidmad_metric_spec fallback was caught by CI and
      removed, and :511-516 records that "Emitting a metric's NAME is not the
      same as being entitled to invent its direction". The census governs
      DERIVATION; the literal is an EMISSION. The module's own docstring states
      the distinction and the literal violates it anyway, which is why a
      derivation-scoped guard stayed green.
    repair_owner: >-
      PR #364, "fix(per-file-best): the table names the run's own metric, not
      TIDMAD's".
    reconciled: >-
      RAISED OPEN AND DISCHARGED IN TWO PASSES OF THE SAME RECONCILIATION, which
      is the shape this row was written to demonstrate. At the first pass PR
      #364 was state OPEN with mergeCommit null, so the row said so and stayed
      PENDING_IMPLEMENTATION: a PR in flight is not a discharge. It has since
      landed as f69c9acf, now origin/master's head, and the discharge is
      recorded against that SHA. Verified on master against the row's own
      finding, which named a LITERAL at a line number - so the check is that the
      literal is gone from the emission, not that a commit exists.
      per_file_best.py:423 now emits "metric_id": table_identity.id if
      table_identity is not None else None. The identity comes from
      _table_identity, the same reconciliation authority the ordering already
      used, so the header and the row order can no longer disagree; and a
      workspace declaring NO identity emits null - a NAMED ABSENCE - rather than
      a default, which matters because such a workspace also has no rows. Three
      TIDMAD_METRIC_ID occurrences remain in the module (:421, :539, :569) and
      ALL THREE ARE PROSE describing the former defect, checked individually
      rather than assumed from the count. THE ADJACENT FIELDS WERE CORRECTLY NOT
      GENERICIZED, and the distinction is worth keeping: score_transform and
      log_base stay constants (:428-429) because they describe _log, the
      transform this module applies to its own derived column, not the run's
      metric. Genericizing them by association would have been the same error in
      the opposite direction - a value made variable that is not.
    what_this_row_now_demonstrates: >-
      The gap it names is closed, but the row is retained rather than deleted
      because it records a guard-shape finding: the Step-09a executable census
      pins which production modules may DERIVE the TIDMAD metric spec, and this
      module correctly derived nothing. The census governs DERIVATION; the
      defect was an EMISSION. A census stays green when the thing it ranges over
      is not the thing that broke.
    dependencies: [D-SCORE-5]
    last_updated: 2026-08-27

