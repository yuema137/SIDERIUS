  - decision_id: D-LLM-9
    parameter: API retry policy
    concept: transient failures retry indefinitely; deterministic defects fail closed
    status: FROZEN_POLICY_PENDING_IMPLEMENTATION_AUDIT
    control_class: EXPERIMENT_FIXED
    frozen_value:
      retry_indefinitely_for:
        - rate limiting
        - transient provider outage
        - 5xx service errors
        - connection failures
        - transient timeout / network failures
        - other mechanically recognized temporary infrastructure errors
      must_preserve:
        - same intended model authority
        - no fallback model
        - no consumption of a new scientific proposal attempt merely because the API transport failed
      fail_closed_for:
        - invalid request schema
        - unsupported parameter
        - malformed configuration
        - permanently invalid credentials
        - deterministic client-side programming error
    audit_result:
      implementation_site: "agent/llm_bridge.py:1264-1322 (_call_with_retry)"
      sdk_retries: 0 (disabled) — this loop is the single authority
      backoff: {schedule: [2.5, 5, 10, 20, 40, 60], cap_seconds: 60.0, initial: 2.5, jitter: NONE}
      by_failure_class:
        rate_limit_429:
          behaviour: retry indefinitely (max_retries=None default)
          extra: honours the API-suggested RetryInfo delay when present
          matches_policy: true
        server_5xx:
          behaviour: retry indefinitely
          matches_policy: true
        other_4xx:
          behaviour: raised immediately, before retry bookkeeping
          covers: [auth, bad request, model not found, unsupported parameter]
          matches_policy: true
          note: this is EXACTLY the fail-closed behaviour the operator specified
        timeout_APITimeoutError:
          behaviour: BOUNDED at 3 total attempts (DEFAULT_TIMEOUT_RETRIES), then raises
          matches_policy: false
        connection_APIConnectionError:
          behaviour: BOUNDED at 3 total attempts, then raises
          matches_policy: false
        content_level_http200_empty_or_nonjson:
          behaviour: bounded, _CONTENT_RETRY_BUDGET = 3, wait 2s -> 16s
          matches_policy: not addressed by the frozen policy (separate axis)
    divergence:
      id: F-LLM-2
      summary: >-
        The frozen policy lists connection failure and transient timeout as
        retry-indefinitely classes. The implementation deliberately bounds both
        at 3 attempts.
      why_it_is_not_simply_a_bug: >-
        The code carries the reasoning at the declaration (2026-08-17): a
        timeout says the request did not fit the configured budget, and
        repeating it unchanged reproduces the outcome. Unbounded timeout retry
        against timeout=120s produced a loop that killed a legitimate 150s
        request forever, made no progress and billed every attempt — a real
        Gate hit exactly that, ten times. This is the same principle as the
        operator's own fail-closed clause: a request that cannot fit a fixed
        timeout is deterministic with respect to that timeout, not transient.
        The current 600s timeout makes the pathological case far less likely.
      options:
        A: {action: ratify current behaviour, effect: amend the frozen policy to name timeout/connection as bounded-with-cause, code_change: none}
        B: {action: raise timeout_retries (e.g. 3 -> 10), effect: keeps the mechanism, widens the budget, preserves the anti-pathological-loop property, code_change: small}
        C: {action: unbounded, effect: matches the policy as literally written, reinstates the 2026-08-17 incident shape if a request ever legitimately exceeds 600s}
      planning_authority_recommendation: B
      recommendation_is_not_a_decision: true
    api_retry_vs_scientific_attempt:
      status: PARTIALLY_VERIFIED
      evidence: >-
        A distinct record status skipped_infrastructure_failure exists
        (nodes/ml_hyperparameter_tune_agent/records.py:313) alongside
        TERMINAL_INFRASTRUCTURE_FAILURE (runtime.py:66), so the framework does
        classify infrastructure failure separately from scientific failure.
      not_established: >-
        Whether a raised LLMBridge exception reaches that classification on
        EVERY path, or whether some path lets it consume a tuner attempt.
      finding_id: F-LLM-3
      finding_status: PENDING_AUDIT
    current_framework_default: see audit_result
    source_of_current_default: agent/llm_bridge.py
    runtime_consumer: every LLM call
