        pairwise figure as "a STALE LOWER BOUND ... must never be reused here")
        applies with equal force in this direction.
      do_not_interrupt_q5_in_progress: >-
        Its platform value stands, and re-running it later is cheap relative to
        disturbing a live qualification.
    mechanisms_assuming_four_way:
