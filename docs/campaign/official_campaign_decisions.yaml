    parameter: semantic relevance map for existing H100 evidence
    concept: which qualification rows survive the topology change
    status: FROZEN                # the classification itself
    control_class: HARDWARE_DERIVED
    do_not_invalidate_wholesale: true
    frozen_value:
      classification:
        - {row: Q1, name: import provenance, class: platform, still_valid: true}
        - {row: Q2, name: hardware-profile resolution, class: platform, still_valid: true}
        - {row: Q3, name: platform execution/storage, class: platform, still_valid: true}
        - {row: Q4, name: minimum real lifecycle, class: platform, still_valid: true}
        - {row: Q5, name: four-way co-residency calibration, class: topology_specific, still_valid: "NOT the formal campaign's admission authority"}
        - {row: Q6, name: "watchdog calibration (#261)", class: topology_specific, still_valid: "regime-keyed — see regime finding"}
        - {row: Q7, name: campaign topology semantics, class: topology_specific, still_valid: must be re-read against max-2}
        - {row: Q8, name: failure/restart witness, class: platform, still_valid: true}
        - {row: Q9, name: A/B launch rehearsal + arm symmetry, class: topology_specific, still_valid: must rehearse the max-2 shape}
      why_q5_cannot_carry_over: >-
        gpu_c_coresidency_probe.sh measures a QUAD leg by construction —
        PROBE_BANDS=("0-3" "4-9" "10-14" "15-19"), leg 2 = "QUAD co-resident
        chains, started together". H100_CORESIDENCY_FACTOR is a FOUR-WAY
