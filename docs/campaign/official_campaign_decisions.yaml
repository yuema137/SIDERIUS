  # -- method canon (M-*), imported unchanged. These carry no disposition and
  # -- no work; they are the M-SCAN-1 family and exist so the way a claim was
  # -- produced survives beside the claim.

  - decision_id: M-CLAIM-1
    parameter: a refusal message is itself a claim and must be true
    concept: the anti-vacuity standard applied to error text
    status: FROZEN
    control_class: NOT_APPLICABLE
    decided: 2026-08-26
    authority: campaign-planning lane, generalized and adopted by Supervisor [ceb12d]
    frozen_value: >-
      An error or refusal message asserts something about the world. If the
      assertion is false in some branch the guard covers, the guard is
      dishonest even when its behaviour is safe.
    the_case_that_produced_it: >-
      F-SCANI-1's fix. A BLANKET refusal on an unset provider key would have
      been safe, and its message - "this provider's endpoint would receive that
      credential" - would have been FALSE for provider="openai", where the SDK
      fallback variable IS that provider's own key env. Narrowing the guard to
      the providers that can actually leak kept the message true.
    why_it_belongs_beside_anti_vacuity: >-
      Anti-vacuity says a check that cannot fail is not a check. This says a
      refusal whose stated reason is false is not a reason. Both are about a
      safety surface asserting more than it can support.
    last_updated: 2026-08-26

