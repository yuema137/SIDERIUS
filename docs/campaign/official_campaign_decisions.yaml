      - {mechanism: launch_band_fleet.sh, assumption: launches all four, consequence: F-BAND-1}
      - {mechanism: "campaign_preflight.sh R4", assumption: requires a filled H100_CORESIDENCY_FACTOR, consequence: still required, but the value must be the TWO-WAY one}
      - {mechanism: "campaign_llm_smoke.py default N=8", assumption: two fleets of four, consequence: now over-sized; 4 matches the new shape}
      - {mechanism: "H100_EXPECTED_QUAD_HOST_ANON_RSS_GB=47", assumption: four-chain host RSS, consequence: two chains need less; the check becomes conservative, not wrong}
      - {mechanism: "SIDERIUS_PREFLIGHT_WORKER_MEM_GIB=24", assumption: worst case 4 simultaneous probe workers, consequence: "worst case becomes 2; the existing note already says this value was never re-derived for four"}
