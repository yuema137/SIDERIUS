      REPAIRED - this is the one row where the two-writer split produced a
      FALSE OPEN BLOCKER rather than a false closure, and a tag-time census over
      the campaign copy would have held the release for work that had landed.
      The required_repair landed as be2cd979 (PR #344), a verified ancestor of
      origin/master d2c12ebe. Verified on master, against the row's own
      required_repair wording ("emitted always, and an absent or contradicting
      value REFUSED rather than defaulted") rather than against the fact that a
      commit exists: _gold_campaign_lib.sh:243-258 gold_llm_config_args resolves
      GOLD_LLM_CONFIG_RELPATH (llm_configs/openai_tiered_pro.json) to an
      ABSOLUTE path - run_chain.sh cd's, so a relative path would not survive -
      and REFUSES with a named error when the file is absent; :547-548 calls it
      inside gold_frozen_chain_args and appends GOLD_LLM_CONFIG_ARGS to
      GOLD_FROZEN_CHAIN_ARGS, so it is EMITTED ALWAYS rather than conditionally;
      run_gold_campaign.sh:189 calls it on the canonical entrypoint; and :815
      places --llm_config in GOLD_RESERVED_PASSTHROUGH, which is what makes the
      binding a BINDING - parse_chain_args is last-wins, so an unreserved
      passthrough --llm_config would land AFTER the frozen args and silently
      override the pinned routing. The three mechanism_verified lines below are
      the PRE-REPAIR state and are retained as the finding's evidence, not as a
      current description; all three are now false on master.
    mechanism_verified:
      - 'run_gold_campaign.sh: ZERO occurrences of llm_config'
      - '_gold_campaign_lib.sh: ZERO occurrences of llm_config'
      - _chain_common.sh:78 LLM_CONFIG="" and :558-559 forwards --llm_config ONLY when non-empty
      - run_one_iteration.py:943 default="gemini-3.1-pro-preview"
      - llm_configs/openai_tiered_pro.json carries the pinned gpt-5.5-2026-04-23 in 8 role slots
    consequence: >-
      A Gold run launched through the CANONICAL entrypoint resolves every LLM
      role to gemini-3.1-pro-preview instead of the frozen, pinned
      gpt-5.5-2026-04-23. It defeats BOTH halves of D-LLM-13-RULING: the
      snapshot pin sits in a config file the run never loads, and the
      served-model capture would faithfully record gemini.
    it_shares_a_ROOT_CAUSE_with_F-SCANI-1: >-
      F-SCANI-1 (the credential leak) was reachable by exactly this omission -
      no --llm_config, so the provider resolves to gemini. The #325 repair makes
      the bridge REFUSE when the resolved provider's key env is unset. So after
      that fix the outcome forks on an environment variable: with GEMINI_API_KEY
      UNSET the run refuses loudly and the fix protects; with it SET the run
      proceeds on gemini SILENTLY, with the wrong model and a scientifically
      void result.
    the_lesson_this_lane_owns: >-
      The F-SCANI-1 reachability analysis stated both premises verbatim - "the
      CLI default IS gemini" and "LLM_CONFIG defaults empty and is forwarded
      only when non-empty" - and drew only the CREDENTIAL conclusion. The
      SCIENTIFIC conclusion, that the campaign would therefore run on the wrong
      model, follows from the same two lines and was not drawn. HAVING THE FACTS
      IS NOT HAVING THE CONSEQUENCE. A finding should be asked "what ELSE does
      this mechanism cause", not only "is this mechanism real".
    why_the_repair_did_not_cover_it: >-
      #325 correctly fixed what F-SCANI-1 CLAIMED - credential exposure - and
      the claim was scoped to the credential. Fixing a stated finding does not
      fix an unstated consequence of the same root cause, and a discharge
      verified against the finding's own wording will not reveal the gap.
    required_repair: >-
      The canonical Gold entrypoint must bind --llm_config to the frozen pinned
      configuration, by the same shape used for retention: emitted always, and
      an absent or contradicting value REFUSED rather than defaulted. A run that
      cannot resolve its declared model authority must not start.
    affects: review-package row 62 and plan section 9.1
    dependencies: [D-LLM-13-RULING, F-SCANI-1, F-LAUNCH-1, R-RETENTION-1]
    last_updated: 2026-08-27

