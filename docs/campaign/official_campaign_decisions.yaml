      is a fabricated "flat" or a degradation figure of 0.0 read as evidence of
      no degradation.
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    reconciled: >-
      The ruling above is carried VERBATIM from the campaign-planning branch
      (014821d5), where it was recorded on 2026-08-26 while this copy still read
      PENDING_OPERATOR_DECISION. This is a RECONCILIATION, not a new operator
      question: the decision already existed and only had not reached the copy
      origin/master ships. DISCHARGED rather than merely FROZEN because the
      ruling is also IMPLEMENTED, verified against merged source at d2c12ebe
      (PR #360) rather than inferred from the commit message.
      agent/schemas/training_diagnosis.py:62 declares DegradationVerdict =
      Literal["observed", "insufficient_history", "not_applicable"] - neither
      identifier existed anywhere in the module before - and :142-143 adds
      validation_degradation_verdict defaulting to not_applicable. The gate is
      :274-286: "if len(r3) >= 2" populates the three degradation fields AND
      sets "observed"; the else sets "insufficient_history" and leaves all three
      None. So at epochs_completed == 1 the fabricated 0.0 / 0.0 / False triple
      - the identity x minus x written out as three measurements, persisted on
      EVERY formal round at the campaign's frozen formal_max_epochs = 1 - is
      gone. run_report.py:314 and :332 carry the verdict into the operator
      report beside validation_degraded_after_best, because a bare None does not
      say WHY: a one-epoch curve and no curve at all are different facts.
      DELIBERATELY NOT GATED, per the ruling's own why_this_is_the_right_shape:
      validation_trend stays single_point, and validation_min /
      best_validation_epoch / the endpoints stay real facts. Recorded because
      the distinction decided the status: a ruling is a DECISION, not a
