  - decision_id: M-SCAN-1
    parameter: scan-method findings from running six adversarial scans
    concept: how a scan produces a confident wrong answer, observed three times
    status: VERIFIED
    control_class: NOT_APPLICABLE
    recorded: 2026-08-26
    why_recorded: >-
      The blocker ledger's value depends on how its entries were produced. These
      are the three ways a wrong claim actually got close to entering it, each
      observed rather than anticipated.
    shape_1_unquoted_governing_text: >-
      Scan G's SEVERITY-1 finding claimed raw_baseline/ground_truth "dilute the
      treatment at its core". Reasoning from COLUMN NAMES. Reading plan sections
      5.3 and 5.4 showed they are the metric's floor and ceiling - task
      instrumentation - while the treatment artifact is a prior MODEL's result.
      Caught before forwarding. Mitigation now standing: every forwarded finding
      declares SOURCE FACT or INTERPRETIVE CLAIM, and an interpretive claim must
      QUOTE the governing text.
    shape_2_an_unflagged_clause_inside_a_verified_finding: >-
      F-SCANB-5 carried "the four legs died in under a second". The finding's
      other claims were verified here; that clause was not, and was not flagged
      as unverified. It rode on the credibility of its neighbours. The Supervisor
      caught it; df3f1c04 states no timing, and the Q5 closure had already
      attributed the sub-second APPEARANCE to stdout buffering. VERIFYING A
      FINDING IS NOT VERIFYING EVERY CLAUSE IN IT.
    shape_3_a_correction_that_reasserts_exhaustiveness: >-
      Scan D self-disclosed that two of its own subagents never returned while
      parts of its report were written as though they had. Its correction pass
      then re-derived "the complete, exhaustive list of direct score_vector
      invocations ... is exactly four" - and dropped
      scripts/finalize_recovered_diagnostic_round.py:118, WHICH ITS OWN EARLIER
      REPORT HAD LISTED. Verification and enumeration are different operations
      and passing the first does not carry the second. Changed no finding; the
      shape is the point.
    what_held: >-
      No forwarded RELEASE BLOCKER was affected by any of the three, because
      each was independently re-verified in this lane before routing. The
      discipline is what made the errors cheap rather than expensive.
    standing_rules_adopted:
      - every forwarded finding declares SOURCE FACT or INTERPRETIVE CLAIM
      - an interpretive claim quotes its governing text or is not forwarded
      - a claim of exhaustiveness prints the command that produced it
      - a pattern returning nothing is stated as "zero hits", never omitted
      - unverified scan output is held AS OUTPUT and never forwarded as a finding
    last_updated: 2026-08-26


