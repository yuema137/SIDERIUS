  - decision_id: A6-2
    parameter: champion granularity — per band or per arm
    status: PENDING_OPERATOR_DECISION
    control_class: EXPERIMENT_FIXED
    finding: >-
      The four bands cover DISJOINT file sets (0-3, 4-9, 10-14, 15-19). Under
      the standing invariant that aggregate scalars are only comparable within
      one scope, scores from different bands are NOT comparable, so a single
      cross-band champion cannot be selected by score.
    forced_structure: >-
      per-band champion -> 4 champions per arm -> 4 paired 100% evaluations per
      arm. The comparable unit is "gold band N vs blind band N".
