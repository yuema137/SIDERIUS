  - decision_id: D-EVAL-1
    parameter: candidate evaluation lifecycle
    status: PROVISIONALLY_FROZEN      # operator-preferred; awaiting final confirmation post-audit
    control_class: EXPERIMENT_FIXED
    frozen_value:
      trial:  {effective_train_scope: 1%, intended_eval_scope: 1%}
      formal: {effective_train_scope: 10%, intended_eval_scope: 10%}
      after_champion_selection:
        eval_scope: 100%
        produces: [authoritative final score, per-file vector, secondary metrics, HealthGate result]
      binding_constraints:
        - the champion MUST be selected BEFORE the 100% evaluation
        - the 100% result MUST NOT feed back into proposal / tuning / search
    mechanism_audit:
      single_source: >-
        eval_portion builds ONE eval_sample_set (planning.py:592-601,
        build_sample_set(trial_portion=trial_config.eval_portion)); that one set
        is consumed by all three evaluation events.
      tidmad_scale: {segments_per_file: 200, psd_segment_length: 10000000}
      sample_fractions:
        - {eval_portion: 0.01, segments_per_file: 2, samples_per_file: 20000000, five_file_band: 100000000}
        - {eval_portion: 0.10, segments_per_file: 20, samples_per_file: 200000000, five_file_band: 1000000000}
        - {eval_portion: 1.00, segments_per_file: 200, samples_per_file: 2000000000, five_file_band: 10000000000}
      E1:
        what: per-epoch forward-only validation pass INSIDE the training subprocess, computing the TRAINING OBJECTIVE (a loss) — not the Golden Metric
        scope: the full eval_sample_set
        scales_with_eval_portion: YES, linearly, multiplied by epochs
        workload_declaration: "train_engine_sandbox.py:1428 unit_count = validation_requested_rows * epochs"
        runtime_contribution: with max_epochs=1, one extra full pass over the eval scope per attempt
      E2:
        what: inference over eval_sample_set -> deliverable -> evaluate_metric -> score_vector
        scope: the full eval_sample_set
        scales_with_eval_portion: YES, linearly, and traversed twice (inference then scoring)
        runtime_contribution: the DOMINANT evaluation cost
      E3:
        what: prefix peeks into the DENOISED DELIVERABLE, timeseries/<channel>/timeseries[:peek_samples] (_peek.py)
        scope: only the health_gate_files, and only peek_samples of each
        scales_with_eval_portion: NO — CONSTANT
        runtime_contribution: 100000-1000000 samples per health-gate file
      decisive_finding: >-
        E3 evidence does NOT degrade at 1%. TIDMAD's largest peek is 1,000,000
        samples; at eval_portion=0.01 each file's deliverable still holds
        20,000,000 samples, and the peek is a PREFIX slice capped at dataset
        end. What a health check sees is IDENTICAL at 1%, 10% and 100%.
        Reducing trial evaluation to 1% costs NOTHING in HealthGate sensitivity.
      combined: the eval scope is traversed (epochs + 1) times per attempt, plus a scoring traversal
      cost_consequence: >-
        E1+E2 scale linearly. Trial at 1% instead of 10% is a 10x reduction in
        the dominant per-attempt eval cost; formal at 10% instead of the current
        v19/v20 100% is a further 10x. E3 is flat throughout.
    dependencies: [D-TASK-6, A6-1, A6-2]
    operator_input_required: true
    last_updated: 2026-08-26

  - decision_id: R-CHAMP-1
    parameter: champion-only 100% re-evaluation — minimum generic implementation
    status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    feasibility: >-
      FEASIBLE. The prerequisite holds: --cleanup_denoised removes DELIVERABLES,
      not weights. The trainer writes
      {sandbox_models_dir}/model_{type}_{exp_id}_agent.pth and nothing deletes
      it. The deliverable does NOT survive, so the champion pass must RE-RUN
      inference.
    stages:
      - {n: 1, stage: select champion from persisted records, reuse: "execute_tools/per_file_best.py + core/scientific_authority.py", new_work: "the selection RULE must be declared; the table exists and today has NO consumer"}
      - {n: 2, stage: rebuild full-scope eval set, reuse: "build_sample_set(trial_portion=1.0, scope=...)", new_work: none}
      - {n: 3, stage: re-run inference with the champion's saved weights, reuse: "inference skill + sandbox.execute_inference", new_work: "a loader resolving exp_id -> .pth AND its plugin source"}
      - {n: 4, stage: score, reuse: "sandbox.evaluate_metric(run_metric, sample_set=full) — UNCHANGED authority", new_work: none}
      - {n: 5, stage: secondary metrics, reuse: "_evaluate_secondary_metrics — fires wherever the primary does", new_work: none}
      - {n: 6, stage: HealthGate, reuse: "execute_tools/health_checks/runner.evaluate_gate", new_work: none}
      - {n: 7, stage: persist, reuse: null, new_work: "a terminal artifact OUTSIDE the record stream"}
    isolation_requirement: >-
      Stage 7 is the only real design constraint. The planner's memory_history is
      built from the workspace record stream; writing the champion result there
      would feed a 100% score back into search, violating the second binding
      constraint. The champion artifact must live at a distinct path and must
      never be read by run_workflow.
    timing_requirement: >-
      The pass must run only AFTER every band reaches its terminal state, so no
      live chain can observe it.
    no_new_scientific_mechanism: true
    owner: release lane, routed through the Supervisor
    dependencies: [D-EVAL-1, A6-1, A6-2]
    last_updated: 2026-08-26

