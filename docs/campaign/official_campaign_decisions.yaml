  - decision_id: A6-2
    parameter: champion granularity — per band or per arm
    status: FROZEN
    resolved_by: D-BUD-9          # plan section 19.9, operator ruling 2026-08-26
    resolution: >-
      PER BAND. "Champion selection occurs PER BAND. There is no cross-band
      champion because the four bands use different data scopes and their scalar
      scores are not directly cross-comparable. Each arm therefore produces four
      band champions." D-BEST-1 and D-BEST-2 are built on that answer.
    superseded_status: PENDING_OPERATOR_DECISION
    control_class: EXPERIMENT_FIXED
    finding: >-
      The four bands cover DISJOINT file sets (0-3, 4-9, 10-14, 15-19). Under
      the standing invariant that aggregate scalars are only comparable within
      one scope, scores from different bands are NOT comparable, so a single
      cross-band champion cannot be selected by score.
    forced_structure: >-
      per-band champion -> 4 champions per arm -> 4 paired 100% evaluations per
      arm. The comparable unit is "gold band N vs blind band N".
    why_not_per_arm: >-
      A single per-arm champion would require an aggregation rule across
      non-comparable scopes, which the frozen metric authority does not provide.
    consequence: >-
      Determines how many 100% evaluations the campaign performs (4 per arm, 8
      total) and what the headline gold-vs-blind comparison actually IS — four
      paired comparisons, not one.
    dependencies: [D-EVAL-1, D-CONC-1]
    operator_input_required: true
    last_updated: 2026-08-26

