  - decision_id: D-FAIL-1
    parameter: failure taxonomy
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      A_SCIENTIFIC_FAILURE:
        definition: the scientific candidate itself fails the legitimate experiment/workflow contract
        examples:
          - scientific validator refusal
          - implementation failure attributable to the candidate
          - invalid / NaN scientific output
          - HealthGate blocking failure
          - candidate legitimately exceeding its allowed scientific resource ceiling
          - other candidate-specific scientific invalidity
        consumes_scientific_opportunity: true
      B_TRANSIENT_INFRA_FAILURE:
        definition: >-
          the candidate has NOT been scientifically disproven; execution was
          interrupted by transient infrastructure unrelated to candidate quality
        examples:
          - transient API / network failure
          - temporary provider failure
          - transient pod / process failure
          - temporary CUDA / runtime infrastructure failure
          - transient filesystem / I-O failure
          - infrastructure interruption unrelated to the scientific candidate
        consumes_scientific_opportunity: false
      C_PERSISTENT_ENVIRONMENT_OR_CONFIG_FAILURE:
        definition: the environment/configuration cannot honestly execute the frozen campaign semantics
        examples:
          - invalid credentials
          - missing required dataset
          - incompatible campaign manifest
          - corrupt dependency / environment
          - unsupported execution configuration
          - wrong release authority
        disposition: MUST fail closed / pause execution
        counted_as_scientific_candidate_failure: false
      D_EVIDENCE_OR_PROVENANCE_FAILURE:
        definition: >-
          execution may have produced partial artifacts, but the framework
          cannot prove the scientific result is authoritative
        examples:
          - missing required artifact
          - incomplete required provenance
          - manifest / hash mismatch
          - inconsistent run identity
          - partial output presented as terminal success
          - evidence channel failure
        is_scientific_success: false
        disposition: >-
          fail closed until evidence is reconstructed or the affected scientific
          opportunity is safely rerun
    dependencies: [D-BUD-14]
    last_updated: 2026-08-26

