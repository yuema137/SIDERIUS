  - decision_id: F-SCANE-3
    parameter: train_time_s includes the validation pass and drives a shrink-the-model instruction
    concept: the agent is told to attribute to architecture a cost it cannot see
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    reconciled: >-
      DISCHARGED 2026-08-27 by ledger reconciliation, not by new work. Landed as
      d2c12ebe (PR #360), which IS origin/master's head. The row's consequence -
      "No LLM can see the term it is being asked to attribute to architecture" -
      is met by TRANSPORT, not by redefinition. Verified on master:
      ExperimentTiming gains validation_time_s (hyperparam_tuning.py:154),
      summed from the trainer's own per-epoch validation_seconds by
      records.py:107 _validation_time_s and emitted into the record's timing
      dict at records.py:1295, so the split now crosses the boundary that
      previously stopped it - training_history is planner-hidden, timing is
      planner-VISIBLE. BOTH LLM-facing renderers state the split, not only the
      one this row cites by line number: prompts.py:1317 for the planner's
      timing block and interpretation_helpers.py:386 for the interpreter's
      Discovery 3, whose header calls its figure an "architectural resource
      cost" beside the identical unsplit number. Fixing only the cited site
      would have been a guard whose set was chosen by what the row happened to
      enumerate. train_time_s is UNCHANGED - the time budget is measured against
      the whole subprocess and narrowing it would be a different defect - and
      None means the producer recorded NO split, never that the pass took zero
      seconds. The "reduce model complexity" instruction is deliberately KEPT:
      the repair is to let the model apply it to the right number, not to remove
      it.
    claim_type: SOURCE_FACT
    finding: >-
      execution.py:773-775 times the WHOLE training subprocess into
      timing.train_time_s (records.py:1266). The subprocess DOES split them -
      train_engine_sandbox.py:1724 records training as elapsed minus
      validation_seconds_total, :1740 records "validation" - but that split
      reaches only the calibration store. The planner prompt renders
      "train={train_s/60:.1f} min" and instructs "If the last run exceeded it,
      reduce model complexity" (agent/prompts.py:1246-1258).
      validation_seconds sits inside training_history, which is PLANNER-HIDDEN
      (agent/prompts.py:896), and is on neither TrainingDiagnosis nor
      ModelRunSummary.
    measured: >-
      validation_seconds of 37.99 and 29.14 per epoch at validation_samples
      15000 in real TIDMAD records. The denominator - a representative formal
      training time - was not measured, so the FRACTION is unquantified.
    consequence: >-
      No LLM can see the term it is being asked to attribute to architecture. A
      candidate can be shrunk for time spent validating it.
    last_updated: 2026-08-26

