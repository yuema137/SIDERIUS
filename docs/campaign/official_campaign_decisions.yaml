# SIDERIUS Official Scientific Campaign — machine-readable decision ledger
#
# Companion to docs/campaign/official_campaign_plan.md, which is the PRIMARY
# operator-facing artifact. This file exists so that campaign decisions can be
# diffed, queried and mechanically checked against a rendered effective config.
#
# RULES
#   * Never invent a value to fill an empty field. Absent knowledge is `null`
#     with the status saying why.
#   * `status` is one of the vocabulary in the plan's §0.
#   * `control_class` is one of: EXPERIMENT_FIXED | TREATMENT |
#     AGENT_CONTROLLED | HARDWARE_DERIVED | EXPLICITLY_DISABLED | null
#   * `explicit_or_implicit` records how the value reaches the runtime TODAY,
#     not how we wish it did.

schema_version: 1
last_updated: 2026-08-27
plan_document: docs/campaign/official_campaign_plan.md
two_writers_note: >-
  THIS FILE HAS TWO WRITERS AND NEITHER IS "the newer copy". origin/master is
  written by the RELEASE lanes and is later on REMEDIATION (a fix lands, the row
  is DISCHARGED with a SHA and an ancestry proof).
  origin/campaign/official-arxiv-campaign-plan is written by the
  CAMPAIGN-PLANNING lane and is later on OPERATOR RULINGS. The divergence is
  bidirectional and, on Q-FCNET-REF-1, bidirectional WITHIN one row - so a
  verdict is decided per FIELD on a landed SHA or a ruling text, never by which
  file was touched last. Reconciled into this copy on 2026-08-27; the campaign
  branch is READ and never written from here. The tag-time release-blocker
  census reads THIS copy alone, which is why a stale row here is a release
  hazard in both directions: a false OPEN holds a tag for work that landed, and
  a false CLOSED ships a real blocker.
census_predicate:
  closed_iff: >-
    status in {DISCHARGED, IMPLEMENTED, VERIFIED, RESOLVED_BY_RULING, MOOT} AND
    no declared open item in any NON-HISTORICAL field.
  enforced_by: tests/unit/docs/test_campaign_decisions_census.py
  historical_fields_are_excluded_by_name: >-
    A historical field records what a row USED TO say. A substring scan cannot
    tell that apart from a live claim, so the exclusion is by NAME and the list
    lives in the guard, which fails when this file grows a name it does not
    know.
census_basis:
  branch: fix/failure-honesty-exit-status
  head: df3f1c04f17f17ad10ef9a5e843e8a4110fe57a4
  note: >-
    Repository facts below were read from source at this checkout. They are
    NOT campaign decisions; they are the current framework behaviour a
    decision must either ratify or override.

status_vocabulary:
  - FROZEN
  - PROVISIONALLY_AGREED
  - PENDING_OPERATOR_DECISION
  - PENDING_RELEASE_IMPLEMENTATION
  - PENDING_TESTPOD_QUALIFICATION
  - HARDWARE_DERIVED
  - NOT_APPLICABLE
  - EXPLICITLY_DISABLED
  # The two below track WORK that a FROZEN decision requires. They never mean
  # the decision itself is open.
  - PENDING_IMPLEMENTATION
  - PENDING_LAUNCH_AUDIT
  - FROZEN_POLICY_PENDING_IMPLEMENTATION_AUDIT   # decision made; code behaviour still being verified
  - PROVISIONALLY_FROZEN                         # decided, subject to ONE named measurement
  - PENDING_AUDIT                                # the FACT a decision rests on is not yet established
  - PENDING_RUNTIME_EVIDENCE                     # needs a measured runtime witness
  - PARTIALLY_FROZEN                             # some sub-decisions frozen, one or more explicitly not
  - VERIFIED_DISABLED                            # an audit proved the mechanism cannot fire
  - VERIFIED_ABSENT                              # an audit proved the mechanism does not exist
  # ---- finding / remediation rows (plan section 0.1, added 2026-08-27) ----
  # The vocabulary above was authored for CONFIGURATION items. The F-/R-/Q-/M-/A-
  # rows are a second population needing CLOSURE verbs a configuration item never
  # needed. All seven were ALREADY IN USE while declared nowhere; this declares
  # reality, it does not introduce anything. Definitions live in plan section 0.1.
  - DISCHARGED                                   # the required work LANDED; the commit is cited
  - IMPLEMENTED                                  # the mechanism exists; weaker than DISCHARGED
  - VERIFIED                                     # an audit ran — UNDER-SPECIFIED, see plan 0.2
  - RESOLVED_BY_RULING                           # answered by a ruling recorded on ANOTHER row
  - MOOT                                         # the question no longer arises
  - PENDING_HARDWARE_EVIDENCE                    # probable duplicate, see plan 0.2
  - CONDITIONAL_ON_BLIND_EXECUTION               # activates only if Blind is executed

#: Which statuses CLOSE a row. Declared here, in machine-readable form, because
#: before 2026-08-27 this set existed ONLY in an operator runbook and in a test's
#: private constant — so the census and the authority it claims to read could
#: drift without either one noticing, and the natural repair for a mismatch was
#: to edit the TEST. `RESOLVED_BY_RULING` was the sharpest case: a terminal value
#: no document declared and no row carried.
#:
#: This is the CLOSED side of the ruled census predicate. The other half — "no
#: declared open item in any NON-HISTORICAL field" — is enforced by the guard,
#: which reads this key rather than its own copy of it.
#:
#: Every member must also appear in `status_vocabulary` above, and
#: `status_vocabulary` must be a subset of the plan's section 0 table. Both
#: directions are asserted by tests/unit/docs/test_campaign_decisions_census.py.
terminal_statuses:
  - DISCHARGED
  - IMPLEMENTED
  - VERIFIED
  - RESOLVED_BY_RULING
  - MOOT

decisions:

  # ---------------------------------------------------------------- naming ---
  - decision_id: D-NAME-1
    parameter: campaign pod naming
    concept: canonical operator-facing names for the three pods
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      testpod: H100 qualification / rehearsal / calibration; NOT part of the formal comparison
      goldpod: formal WITH_ADVICE arm
      blindpod: formal WITHOUT_ADVICE arm
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: launch scripts, reports, provenance artifacts
    explicit_or_implicit: explicit
    operator_rationale: >-
      GPU-A/B/C named hardware rather than scientific role and were repeatedly
      mis-read across sessions. A pod name must state what the pod is for.
    goldpod_value: goldpod
    blindpod_value: blindpod
    testpod_relevance: names testpod
    required_evidence: documentation and launch-artifact convention only
    dependencies: []
    historical_aliases:
      testpod: GPU-C
      goldpod: Arm A / WITH_ADVICE / repo lineage "with-prior-art"
      blindpod: Arm B / WITHOUT_ADVICE / repo lineage "without-prior-art"
    last_updated: 2026-08-26

  # -------------------------------------------------------- control plane ---
  - decision_id: D-CTRL-1
    parameter: control-plane hierarchy
    concept: who holds release authority vs execution authority
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      chain: Operator -> RTX 5090 Supervisor -> per-pod execution coordinator -> local pod workers
      supervisor_owns:
        - release routing
        - merge and tag authority
        - final release acceptance
        - campaign-config acceptance
        - blocker disposition
        - v0.1.0 promotion
        - operator escalation
      pod_coordinator_owns:
        - local execution
        - local scheduling
        - CPU/GPU utilization
        - local worker lifecycle
        - local evidence collection
        - local heartbeat and monitoring
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: operational process, not code
    explicit_or_implicit: explicit
    operator_rationale: >-
      A pod coordinator that also holds release authority can silently change
      what the campaign runs, making "which code produced this result"
      unanswerable.
    goldpod_value: execution-plane coordinator only
    blindpod_value: execution-plane coordinator only
    testpod_relevance: execution-plane coordinator only
    required_evidence: >-
      Pod coordinators have no merge/tag capability; each pod's launched
      release SHA equals the Supervisor's tagged v0.1.0.
    dependencies: []
    last_updated: 2026-08-26

  # ------------------------------------------------ configuration principle ---
  - decision_id: D-PRIN-1
    parameter: no implicit semantic defaults
    concept: every behaviourally relevant setting is classified and explicitly materialised
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      classify_as_exactly_one_of:
        - EXPERIMENT_FIXED
        - TREATMENT
        - AGENT_CONTROLLED
        - HARDWARE_DERIVED
        - EXPLICITLY_DISABLED
      rules:
        - intentionally null -> write null explicitly
        - intentionally disabled -> disable explicitly
        - agent-controlled -> state the allowed authority/action space
        - hardware-derived -> record the qualified evidence
      may_not_rely_on:
        - parser defaults
        - schema defaults
        - environment inheritance
        - current framework behaviour merely because it is what happens today
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: the frozen campaign manifest
    explicit_or_implicit: explicit
    operator_rationale: >-
      A future framework-default change must not retroactively change the
      meaning of the frozen campaign. Semantics stored in defaults live
      outside the campaign record.
    goldpod_value: applies
    blindpod_value: applies
    testpod_relevance: applies to rehearsal config too
    required_evidence: >-
      Freeze checklist renders the effective config and proves every
      campaign-relevant field resolves to an explicitly recorded source.
    dependencies: []
    last_updated: 2026-08-26

  - decision_id: D-PRIN-2
    parameter: fix the environment, not the agent's outcome
    concept: reproducibility means same opportunity, not same decision
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      fix:
        - task
        - data
        - splits
        - budgets
        - available tools / action space
        - metrics
        - HealthGates
        - resource limits
        - LLM authority
        - randomness where appropriate
      do_not_fix:
        - architecture selected by proposer
        - loss selected by proposer
        - tuning path
        - proposal sequence
        - scientific strategy
        - hyperparameters reached by legitimate agent-controlled search
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: control-class assignment for every field in the inventory
    explicit_or_implicit: explicit
    operator_rationale: >-
      A difference produced by an AGENT_CONTROLLED decision is an outcome. A
      difference produced by configuration is a confound.
    goldpod_value: applies
    blindpod_value: applies
    testpod_relevance: applies
    required_evidence: >-
      Every arm difference at freeze time must trace to a field whose class is
      TREATMENT.
    dependencies: []
    last_updated: 2026-08-26

  # ============================================================== #
  # DECISION AREA 1 — TREATMENT DEFINITION — FROZEN 2026-08-26     #
  # Operator ruling. Not to be reopened unless the operator        #
  # explicitly reopens it. Items marked PENDING_IMPLEMENTATION or  #
  # PENDING_LAUNCH_AUDIT are WORK, not open questions.             #
  # ============================================================== #

  - decision_id: D-TREAT-1
    parameter: goldpod treatment
    concept: the WITH_ADVICE arm receives two immutable artifacts at every proposer round
    status: FROZEN
    control_class: TREATMENT
    frozen_value:
      arm: goldpod
      receives_at_every_proposer_round:
        A: the same immutable general optimization-advice artifact
        B: the same immutable prior-TIDMAD-baseline-information artifact
      intent: >-
        Provide useful prior information and encourage strong optimization and
        exploration WITHOUT prescribing a specific solution.
    current_framework_default: >-
      launch_prior_baseline_experiment.sh REFUSES --advice / --human_advice_file
      as passthrough in BOTH arms (see T-IMPL-1)
    source_of_current_default: sdsc_submission_scripts/launch_prior_baseline_experiment.sh (header)
    runtime_consumer: proposal agent (ml_model_proposal_agent)
    explicit_or_implicit: not yet implemented for this treatment definition
    operator_rationale: >-
      The experiment asks whether prior information plus optimization guidance
      improves autonomous scientific search. Guidance that names the answer
      would measure obedience rather than search.
    goldpod_value: both artifacts present, every round
    blindpod_value: both explicitly disabled (D-TREAT-5)
    testpod_relevance: rehearsal must verify injection plumbing
    required_evidence: [D-TREAT-6, D-TREAT-7]
    dependencies: [D-TREAT-8, T-IMPL-1]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-2
    parameter: general optimization advice — semantics
    concept: what the advice artifact must and must not communicate
    status: FROZEN
    control_class: TREATMENT
    frozen_value:
      communicates:
        - best possible primary scientific score within all frozen validity, resource and campaign constraints
        - full and productive use of the available proposal, tuning, training and runtime budgets
        - explore broadly rather than converging prematurely on one familiar model family
        - >-
          actively consider: new model architectures; new loss/objective
          functions; architecture + loss combinations; materially different
          scientific/ML strategies where allowed by the frozen action space
        - >-
          models roughly 10M-500M parameters are acceptable and encouraged for
          exploration when compatible with the frozen resource and runtime
          constraints
      parameter_range_interpretation:
        - NOT a hard minimum
        - NOT a target model size
        - smaller models remain fully allowed
        - larger models are NOT automatically allowed merely because they might fit
        - all candidates remain subject to the frozen resource/admission/runtime authorities
      must_not_prescribe:
        - a particular architecture
        - a particular loss
        - a particular optimizer
        - a particular scheduler
        - a particular training recipe
      goal: broad, score-oriented exploration, not imitation of a known solution
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: proposal agent
    explicit_or_implicit: not yet implemented
    operator_rationale: see D-TREAT-1
    goldpod_value: present
    blindpod_value: explicitly disabled
    testpod_relevance: rehearsal verifies injection, not advice quality
    required_evidence: [D-TREAT-7]   # goldpod positive witness
    dependencies: [D-TREAT-8]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-3
    parameter: prior TIDMAD baseline information artifact
    concept: recomputed official TIDMAD baseline evaluation information
    status: FROZEN
    control_class: TREATMENT
    frozen_value:
      character: quantitative and descriptive; verified result-level evidence
      fields_where_available:
        - baseline identity
        - overall / aggregate primary score
        - per-file score vector
        - secondary metric results
        - HealthGate / health-check results
        - metric definitions / metadata
        - score direction
        - aggregation rule
        - evaluation scope
        - number of evaluated files/items
        - evaluation authority / version
        - provenance
        - content hash
      must_not_contain: >-
        strategic recommendations such as "the baseline is weak on file X,
        therefore try method Y", unless the operator separately approves such
        content as part of the advice
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: proposal agent
    explicit_or_implicit: not yet implemented
    operator_rationale: >-
      The treatment supplies prior INFORMATION. Interpretation smuggled into a
      data artifact would silently make the treatment a different, undeclared
      variable.
    goldpod_value: present
    blindpod_value: explicitly disabled
    testpod_relevance: rehearsal verifies injection plumbing
    required_evidence: content review against the field list; content hash frozen (D-TREAT-8)
    dependencies: [D-TREAT-8]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-4
    parameter: baseline assets excluded from the treatment
    concept: the boundary between prior result-level information and a ready-made asset
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      excluded:
        pretrained_official_baseline_weights_or_checkpoints: >-
          Existing learned model parameters that could be loaded, fine-tuned,
          distilled, evaluated directly, or otherwise reused.
        executable_official_baseline_code: >-
          The prior baseline's implementation/training code that could simply
          be copied, executed, or modified.
        exact_reconstructable_architecture_recipe: >-
          Architectural information detailed enough to reconstruct the prior
          baseline directly rather than independently explore the allowed
          design space.
        exact_historical_training_recipe: >-
          The concrete optimizer/hyperparameter/training procedure used to
          obtain the historical result.
      treatment_is: prior result-level information + broad optimization advice
      treatment_is_not: a ready-made model / implementation / recipe
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: content of the D-TREAT-3 artifact
    explicit_or_implicit: explicit content constraint on an artifact not yet authored
    operator_rationale: >-
      Supplying the asset would convert the experiment from "does prior
      knowledge help autonomous search" into "can the agent copy a known-good
      answer".
    goldpod_value: excluded
    blindpod_value: excluded
    testpod_relevance: n/a
    required_evidence: >-
      Content review; D-TREAT-6 also searches for baseline-code and
      architecture-recipe fingerprints, not only for scores.
    dependencies: [D-TREAT-3]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-4B
    parameter: treatment injection location and timing
    concept: which nodes receive the treatment artifacts directly, and when
    status: FROZEN
    control_class: TREATMENT
    frozen_value:
      injected_directly_into: [proposer]
      cadence: every round
      immutability_per_round: same immutable advice artifact and same immutable prior-baseline artifact
      must_not_be_directly_injected_into:
        - implementor
        - validator
        - tuner
        - reflector
        - interpretation
      downstream_note: >-
        Those nodes may naturally receive information propagated through the
        normal typed workflow from the proposal and from subsequent execution.
        They must not receive an additional direct copy of the gold treatment
        artifact.
      channel: immutable advice/prior artifacts -> proposer -> normal SIDERIUS typed workflow
      change_requires: the operator explicitly reopening this decision
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: workflow wiring
    explicit_or_implicit: not yet implemented
    operator_rationale: >-
      A clean single-point treatment channel. Five simultaneous direct
      injections would be five interventions, none individually attributable.
    goldpod_value: proposer only, every round
    blindpod_value: nowhere
    testpod_relevance: rehearsal verifies the per-node census
    required_evidence: >-
      Per-node rendered-context census: the artifacts' unique tokens appear in
      the proposer's context and in no other node's.
    dependencies: [T-IMPL-1]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-5
    parameter: blindpod treatment
    concept: explicit materialised absence of both treatment components
    status: FROZEN
    control_class: EXPLICITLY_DISABLED
    frozen_value:
      advice: DISABLED
      prior_TIDMAD_baseline_information: DISABLED
      constraints:
        - do NOT implement merely through omission
        - do NOT rely on any framework default
        - >-
          the final frozen configuration AND effective argv must explicitly
          materialize the absence of both treatment components
    current_framework_default: >-
      --baseline_isolation exists and is recorded positively in the run
      invariants lock (core/run_invariants.py:184,255,406,553), but it was
      designed for a DIFFERENT arm definition — see Q-ISO-1.
    source_of_current_default: core/run_invariants.py; launch_prior_baseline_experiment.sh
    runtime_consumer: workflow wiring + run_invariants_lock.json + child argv
    explicit_or_implicit: >-
      partially available: baseline_isolation is explicit and recorded; an
      advice-absence materialisation for THIS treatment does not exist yet
    operator_rationale: >-
      An absence produced by omission is indistinguishable from an absence
      produced by a dropped flag, a launcher bug, or a future default change.
      Only an explicitly recorded "off" is auditable.
    goldpod_value: n/a
    blindpod_value: both explicitly off
    testpod_relevance: rehearsal must verify blind absence
    required_evidence: D-TREAT-6
    dependencies: [T-IMPL-1]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-6
    parameter: blindpod leakage audit
    concept: negative witness — formal launch gate
    status: FROZEN                        # the requirement is frozen
    audit_status: PENDING_LAUNCH_AUDIT    # the evidence is collected at launch
    control_class: EXPERIMENT_FIXED
    conditional_on_blind_execution_2026_08_26: >-
      Remains a formal gate ON BLIND, in full and unweakened. The campaign is
      GOLD-ONLY, so it does NOT gate the Gold launch and its absence neither
      blocks nor invalidates completed Gold. Reactivates if and when Blind runs.
    frozen_value:
      is_a_formal_launch_gate: true (ON BLIND — see conditional note above)
      layers_at_least:
        - effective configuration
        - treatment / artifact paths
        - rendered proposer prompt / context
        - runtime context / transcript evidence
      discriminative_negative_controls:
        - treatment artifact hash
        - prior-baseline artifact hash
        - unique advice phrases
        - unique baseline score / value(s)
        - baseline artifact name / path
      decisive_requirement: >-
        The audit must demonstrate absence FROM THE ACTUAL MODEL-VISIBLE
        CONTEXT, not merely that a Boolean configuration field is false.
    current_framework_default: >-
      campaign_arm_symmetry.py diffs resolved-config JSON + child argv with
      explicit allowlists. It does NOT inspect rendered prompts or runtime
      transcripts — see T-IMPL-3.
    source_of_current_default: sdsc_submission_scripts/campaign_arm_symmetry.py
    runtime_consumer: preflight R7 / launch packet
    explicit_or_implicit: partially implemented (config + argv layers only)
    operator_rationale: >-
      A false flag proves what the configuration intended, not what the model
      saw. A search for a generic term can come back empty for the wrong
      reason; a discriminative control is a check that could actually fail.
    goldpod_value: n/a
    blindpod_value: negative assertion at four layers
    testpod_relevance: rehearsed on testpod before formal launch
    required_evidence: the audit's own evidence artifact, recorded in the launch packet
    dependencies: [D-TREAT-8, T-IMPL-3]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-7
    parameter: goldpod positive treatment audit
    concept: positive witness — formal launch gate
    status: FROZEN
    audit_status: PENDING_LAUNCH_AUDIT
    control_class: EXPERIMENT_FIXED
    frozen_value:
      is_a_formal_launch_gate: true
      must_prove:
        - every goldpod proposer round receives the intended immutable advice artifact and prior-baseline artifact
        - the artifact hashes match the frozen campaign authority
        - no round silently omits or mutates the treatment
      pairing_rule: >-
        The treatment audit contains BOTH the goldpod positive witness and the
        blindpod negative witness. Neither alone is sufficient.
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: preflight / launch packet
    explicit_or_implicit: not implemented
    operator_rationale: >-
      A treatment that silently stopped being injected at round 4 would produce
      a null result indistinguishable from a true null result. Absence of
      evidence of leakage is not evidence of treatment.
    goldpod_value: positive assertion, every round
    blindpod_value: n/a
    testpod_relevance: rehearsed on testpod before formal launch
    required_evidence: per-round witness records with artifact hashes
    dependencies: [D-TREAT-8, T-IMPL-3]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-8
    parameter: treatment artifact immutability and content hashes
    concept: freeze and hash both artifacts before launch; never rewrite them
    status: FROZEN                        # the requirement is frozen
    artifact_status: PENDING_IMPLEMENTATION  # the artifacts are not yet authored
    control_class: TREATMENT
    frozen_value:
      before_formal_launch_freeze_and_content_hash:
        - general advice artifact
        - recomputed TIDMAD prior-baseline artifact
      record_hashes_in:
        - docs/campaign/official_campaign_plan.md §5.9
        - the machine-readable campaign manifest
      constraints:
        - do NOT dynamically rewrite either artifact between rounds, bands, or chains
        - all four goldpod chains receive byte-identical treatment artifacts
      hashes:
        general_optimization_advice:
          sha256: null                    # not yet authored
          status: PENDING_IMPLEMENTATION
        recomputed_tidmad_prior_baseline:
          sha256: null                    # not yet authored
          status: PENDING_IMPLEMENTATION
    current_framework_default: null
    source_of_current_default: null
    runtime_consumer: campaign manifest + proposer injection
    explicit_or_implicit: not yet implemented
    operator_rationale: >-
      An artifact that varies between bands makes the four goldpod chains four
      different experiments. A hash recorded in the manifest is what makes
      "the treatment was constant" a checkable claim rather than an assertion.
    goldpod_value: byte-identical across all four chains
    blindpod_value: n/a
    testpod_relevance: rehearsal needs real content to test injection meaningfully
    required_evidence: operator review; sha256 pinned in plan §5.9 and in the manifest
    dependencies: [D-TREAT-2, D-TREAT-3]
    last_updated: 2026-08-26

  - decision_id: D-TREAT-9
    parameter: fairness / control principle
    concept: everything outside the treatment is symmetric
    status: FROZEN
    control_class: EXPERIMENT_FIXED
    frozen_value:
      rule: >-
        Outside the frozen treatment difference, goldpod and blindpod must have
        the same experiment-fixed authorities and the same allowed agent action
        space.
      outcome_vs_confound: >-
        Differences that arise later because agents make different legitimate
        AGENT_CONTROLLED scientific decisions are campaign OUTCOMES, not
        configuration asymmetries.
      compares: same opportunity + different prior information
      does_not_compare: different engineering capability
    current_framework_default: >-
      campaign_arm_symmetry.py enforces argv + resolved-config symmetry against
      explicit allowlists, and also ASSERTS the expected asymmetries (two arms
      that resolve identically are mis-wired, not symmetric).
    source_of_current_default: sdsc_submission_scripts/campaign_arm_symmetry.py
    runtime_consumer: preflight R7
    explicit_or_implicit: explicit (mechanism exists; its allowlist needs T-IMPL-2)
    operator_rationale: see frozen_value
    goldpod_value: applies
    blindpod_value: applies
    testpod_relevance: n/a (testpod is not part of the formal comparison)
    required_evidence: arm-symmetry PASS with the expected asymmetries PRESENT — CONDITIONAL_ON_BLIND_EXECUTION
    dependencies: [T-IMPL-2]
    last_updated: 2026-08-26

  # ------ Work items required BY the frozen Decision Area 1. -----------------
  # These are implementation/audit dependencies. They do NOT reopen §5.

  - decision_id: T-IMPL-1
