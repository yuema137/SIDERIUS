  - decision_id: M-RECONCILE-1
    parameter: D-BUD-6 was nearly reclassified from FROZEN to debt
    concept: a near-miss, and what it implies about the launcher validation
    status: VERIFIED
    control_class: NOT_APPLICABLE
    recorded: 2026-08-26
    the_near_miss: >-
      A pre-RC reconciliation reported that this decisions file records
      max_epochs=1 as "declared interim, with the trial-2 split recorded as
      debt, not divergence", and asked the campaign-planning lane to confirm
      either that reading or the 2/1 split. Had (A) been confirmed, a FROZEN
      scientific parameter would have been reclassified as post-v1 debt by a
      confirmation rather than by an operator ruling.
    what_the_record_ACTUALLY_says: >-
      D-BUD-6 status FROZEN, frozen_value {trial_max_epochs 2, formal_max_epochs
      1}, implementation_status PENDING_IMPLEMENTATION, gap "the current
      implementation does NOT represent the frozen campaign semantics". No
      ledger entry anywhere records max_epochs=1 as the frozen campaign value.
    the_likely_misreading_path: >-
      Reconcile the launcher against the IMPLEMENTATION, find max_epochs=1, then
      read implementation_status PENDING_IMPLEMENTATION together with
      historical_state "v19/v20 used ONE mode-agnostic max_epochs = 1" and
      conclude that 1 is the declared interim. The two fields stating the FROZEN
      VALUE were skipped; the two fields DESCRIBING THE DEFECT were read as the
      decision.
    resolution: >-
      Supervisor read the validator's canon SOURCE
      (tools/validation_f2_launcher/frozen_values.py) rather than answering from
      memory. The reconciliation target for the other TWELVE values WAS the
      frozen decision tables, quoted verbatim beside their citations. Twelve
      validly validated; the epochs row is the SINGLE miss. The "all 13 exact"
      claim to the operator is corrected to "12 decision-anchored exact + 1
      implementation-echo".
    the_confirmed_shape_is_SHARPER_than_predicted: >-
      The prediction was "validating against the thing under test". What
      actually happened is more specific and worse. The canon entry reads
      verbatim '"max_epochs": (1, "decisions D-BUD-6 INTERIM: mode-agnostic SAFE
      value; the frozen trial-2/formal-1 split is PENDING_IMPLEMENTATION
      (declared debt, not a divergence)")'. The misreading was not made at
      validation time - IT WAS WRITTEN INTO THE CANON, with a prose rationale,
      and the validator then enforced it correctly.
    why_that_is_the_dangerous_form: >-
      A misreading encoded as a canon entry stops being a mistake and becomes a
      RULE. The validator was correct-by-construction relative to a wrong canon,
      so every future pass would have re-confirmed it, and each pass would have
      looked like independent verification. The prose rationale is what makes it
      durable: a bare wrong value invites a re-check, while a wrong value
      carrying a citation and a justification reads as settled. NAMED VARIANT:
      gap-field-read-as-decision.
    what_held: >-
      Reading D-BUD-6 and plan section 19.6 verbatim before answering, rather
      than answering from memory of what the campaign "runs at".
