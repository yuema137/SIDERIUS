  - decision_id: F-CONFOUND-2
    parameter: shared host + fixed wall-clock ceilings — GOLD RUNTIME / RESOURCE-SELECTION RISK
    status: PENDING_HARDWARE_EVIDENCE
    classification: GOLD RUNTIME / RESOURCE-SELECTION RISK
    reclassified_2026_08_26: >-
      First recorded as a Gold-vs-Blind treatment-axis confound. The campaign is
      GOLD-ONLY, so uncontrolled neighbour load is NOT presently a treatment-axis
      confound — there is no Blind to be biased against. The MEASUREMENT stands
      and the MECHANISM stands; only the claim about what it biases changes.
      Do NOT claim it biases Gold relative to Blind while Blind is not run.
    surviving_framing: >-
      A WITHIN-GOLD selection effect, which is arguably the more directly
      actionable framing: candidates pushed toward the ceiling by the advice and
      the 60GB budget sit closest to breach, so a busy neighbour preferentially
      removes exactly the large candidates the treatment exists to encourage.
      That distorts WHICH SCIENCE GOLD GETS TO DO, whether or not a second arm
      ever exists.
    reactivates_as_treatment_axis_if: Blind is executed for a formal quantitative comparison
    measurement_update_2026_08_26:
      reading_1: 60.17 / 59.00 / 56.23 on 224 cores
      reading_2: 66.88 / 51.09 / 51.60 on 224 cores, all four GPUs at 0%, nothing of ours running
      finding: >-
        ~23-30% of the host consumed by other tenants, and it MOVES between
        readings minutes apart. Time-variance is the property that makes this
        real rather than theoretical, and it is now MEASURED, not assumed.
    control_class: EXPERIMENT_FIXED
    discovered_by: campaign-planning lane, 2026-08-26
    interacting_frozen_facts:
      - the time ceilings 30 / 120 / 200 are WALL-CLOCK and FIXED (D-HW-7)
      - the Gold host is SHARED with other tenants whose load we do not control and which varies over time (~27% baseline measured)
      - Gold and Blind run at MATERIALLY DIFFERENT TIMES (D-HW-5, D-ARM-1)
    consequence: >-
      The two arms may execute under materially different host contention. A
      candidate needing 25 solo-minutes fits a 30-minute trial ceiling on a
      quiet host and BREACHES it on a busy one — and D-FAIL-4 classifies a
      ceiling breach as SCIENTIFIC / RESOURCE_INFEASIBLE, which CONSUMES a
      scientific attempt. Neighbour load therefore becomes a source of
      attempt-loss that can differ between the arms for reasons entirely
      unrelated to their science.
    why_it_AMPLIFIES_F_CONFOUND_1: >-
      Neighbour-load variance hurts most the arm whose candidates sit CLOSEST to
      the ceiling, and the goldpod treatment is precisely what pushes candidates
      toward the ceiling — through both the 10M-500M advice and the 60GB budget.
      The arm the treatment makes larger is the arm most sensitive to a variable
      neither arm controls.
    required_response: PROVENANCE, not a policy change
    provenance_requirement: >-
      Concurrent host baseline load MUST be recorded per attempt, so that
      (a) A-HOST-1 can separate our four-band contention from a neighbour's,
      (b) the D-ARM-1 temporal-separation record can show whether the arms ran
      under comparable host conditions, and (c) post-hoc analysis can tell an
      attempt lost to a large candidate from one lost to a busy neighbour.
    reopens_no_frozen_decision: true
    dependencies: [F-CONFOUND-1, A-HOST-1, D-HW-7, D-ARM-1, D-FAIL-4]
    last_updated: 2026-08-26

