      corpus_scope: all of Semantic Scholar; max_rounds 3, results_per_query 10, escalation_allowed true, max_escalations_per_round 2
      reaches_proposer:
        - {channel: findings -> expert_context, crosses: true, note: synthesised; equations and pseudocode inline in content}
        - {channel: agent_card -> agent_cards, crosses: true}
        - {channel: new_vocab_candidates -> vocab_seed, crosses: true, note: EMPTY in v1}
        - {channel: suggested_mindset -> mindset, crosses: true, note: EMPTY in v1}
        - {channel: retrieved_papers, crosses: false, note: audit-trail only, explicitly never crosses the edge}
      can_recover_tidmad_prior_today: >-
        YES — directly and by configuration. configs/lit_review_config.yaml
        declares root_papers arxiv 2406.04378 (THE TIDMAD PRIMARY PAPER) at
        verbosity 1 (full PaperExtract), resolved at agent start on EVERY
        iteration, delivering official baseline architectures, reported scores
        and training setup into synthesis and thence into expert_context.
    enforcement_problem:
      mechanism_exists: false
      evidence: >-
        No denylist / blocklist / exclusion mechanism exists in
        agent/skills/paper_resolver_skill/ or nodes/ml_literature_review/. A
        repo-wide search for denylist/deny_list/blocklist/exclude/forbidden
        across both returns nothing relevant.
      problem_1:
        name: the root paper
        difficulty: EASY — config only
        fix: remove the 2406.04378 entry from root_papers; closes the deterministic guaranteed delivery
      problem_2:
        name: dynamic search rediscovery
        difficulty: HARD — the honest blocker
        why: >-
          Queries are LLM-authored FROM THE TIDMAD TASK DESCRIPTION and the
          corpus is all of Semantic Scholar. A search anchored on broadband
          signal denoising / axion detection / SQUID time series is reasonably
          likely to surface the TIDMAD paper on its own merits — that is the
