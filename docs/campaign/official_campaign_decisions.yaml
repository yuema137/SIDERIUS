      CLAUDE.md documents two structural divergences bearing directly on
      "training-order semantics": the paper trains FOUR separate models per
      architecture via a frequency-band split (ifile_checkpoint =
      [0,4,10,15,20] in train.py) whereas SIDERIUS trains a SINGLE generalist
      across all files; and the paper RE-INITIALIZES THE OPTIMIZER PER FILE
      inside its for-ifile loop whereas SIDERIUS uses a single optimizer.
      Report whether shuffle=false alone reproduces the intended paper
      semantics given those differences, or whether the correspondence is
      partial.
    reporting_obligation_not_a_challenge: >-
