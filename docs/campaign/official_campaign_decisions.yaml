  - decision_id: F-N4
    parameter: the timing-split prose told the planner two false things
    concept: F-SCANE-3 stated its own meaning in four places and all four were wrong
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    claim_type: SOURCE_FACT
    raised: 2026-08-27
    authority: blinded adversarial review (N-4); content verified in this lane against PR #367 head 175a0dc0
    finding_claim_1: >-
      "Validation time ... does not shrink when the model shrinks." FALSE:
      train_engine_sandbox._run_validation_pass runs model(input_seq) per
      batch - a forward pass of the model under test - so a smaller or cheaper
      model makes the pass cheaper. What is fixed is the evaluation SCOPE (the
      sample count), not the cost of a sample. What validation genuinely does
      not respond to is the TRAINING-side levers: fewer epochs, less training
      data, fewer optimizer steps.
    finding_claim_2: >-
      "the architecture's own cost is train_time_s - validation_time_s."
      FALSE: train_time_s is the PARENT's wall clock around the whole training
      subprocess, while the trainer's own architecture-cost analogue starts
      after setup completes. The residual therefore also carries process spawn,
      CUDA init, model/optimizer construction, epoch-0 dataset materialization
      and checkpoint save - fixed overhead no design change removes. It is an
      UPPER BOUND on the architecture's training cost, never the cost itself.
    consequence: >-
      Under a hard time budget the planner was told to IGNORE the one term that
      does respond to shrinking the model, and to ATTRIBUTE TO ITS OWN DESIGN a
      residual containing cost no design can remove - systematically
      under-pricing large candidates and over-pricing small ones. Both errors
      point the same way, so they compound rather than cancel.
    reclassified_2026_08_27: >-
