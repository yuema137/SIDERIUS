  # ------------------------------------------- SCAN D findings (2026-08-26) ---
  - decision_id: F-SCAND-1
    parameter: a forbidden aggregation is implemented and the proposer is invited to use it
    concept: mean of per-file LOG scores, reachable on band-shaped slices
    status: DISCHARGED
    superseded_status: PENDING_IMPLEMENTATION
    control_class: EXPERIMENT_FIXED
    disposition: RELEASE_BLOCKER
    reconciled: >-
      DISCHARGED 2026-08-27 by ledger reconciliation, not by new work. Both
      halves landed and both commits are verified ancestors of origin/master
      3995400b. 8636220e (PR #325) made the load-bearing half refuse:
      nodes/result_interpretation_agent/prediction.py:258-296 returns
      (None, "refused_forbidden_aggregation") for a slice, landing the
      prediction in the EXISTING unevaluated pool and deliberately inventing no
      alternative aggregation. b31275df (PR #328) closed the advertised-grammar
      half: all three prompt sites this row names now teach the legal index form
      - evidence_rendering.py:390 and :509 and agent/schemas/proposal.py:61 read
      'file_vector[17]', and no mean(file_vector[N:M]) remains on any
      production LLM-facing surface. NOT closed by this row:
      second_finding_43_percent_silent_parse_failure is a different defect with
      no requirement stated here and needs its own row rather than being buried
      by this closure.
    raised: 2026-08-26
    authority: Scan D subagent finding, EVERY HOP independently re-verified by the campaign-planning lane
    finding: >-
      nodes/result_interpretation_agent/prediction.py:269 computes
      sum(values)/len(values) over a slice of per-file log_5.27 scores. That is
      forbidden pattern 1 verbatim ("mean of per-file log scores") and, on a
      band-shaped slice, simultaneously pattern 2 ("mean of per-band log
      scores"). execute_tools/scoring_utils.py:24-29 states the prohibition and
      names 4/6/5/5 explicitly - which is this campaign's band partition.
    verified_chain:
      - 'result_interpretation_agent.py:820  prev_fv = [r.model for r in prev_table.rows]'
      - 'agent/schemas/score_table.py:61-63  model is "log_{5.27} per-file score from this run"'
      - 'ml_hyperparameter_tune_agent/execution.py:1459  _sc_fv_log = file_vector_to_log_space(_sc_fv)'
      - 'result_interpretation_agent.py:823-825  actual_results = {"best_file_vector": prev_fv}'
      - 'prediction.py:95  _PER_SAMPLE_KEY = "best_file_vector"'
      - 'prediction.py:252  fv = results.get(_PER_SAMPLE_KEY)'
      - 'prediction.py:269  return (sum(values) / len(values) ...), "per_sample_slice"'
    the_grammar_is_advertised_in_production_prompts:
      - 'nodes/ml_model_proposal_agent/evidence_rendering.py:390'
      - 'nodes/ml_model_proposal_agent/evidence_rendering.py:509'
      - 'agent/schemas/proposal.py:61-62'
    no_constraint_on_the_slice: >-
      Nothing constrains N:M. mean(file_vector[0:4]) / [4:10] / [10:15] /
      [15:20] are exactly what a band-aware planner would write, and they are
      exactly this campaign's bands.
    scope_limit_stated_honestly: >-
      This does NOT feed Golden-Metric ranking or champion selection. It
      corrupts the prediction-accuracy statistic (scientific_accuracy,
      prediction.py:320-324) and steers the proposer, which renders it as a
      track record. Severity is "a published scientific number is computed by a
      rule the repo declares invalid", not "the headline score is wrong".
    campaign_specific_aggravation: >-
      In a single-scope run mean(file_vector[0:5]) is a weird-but-local
      statistic. Under this campaign's 4/6/5/5 band partition a band-aware
      proposer writing mean(file_vector[0:4]) produces precisely the
      construction scoring_utils.py section 3 names as INVALID, and the campaign
      would publish a prediction-accuracy number derived from it.
    unmeasured_arm_asymmetry_risk: >-
      MECHANISM ONLY, NOT MEASURED. The proposer is where the treatment enters.
      Gold's advice instructs the agent to make full and productive use of
      budgets and to explore broadly, so a Gold agent is plausibly more likely
      to author sophisticated band-shaped predictions than a Blind one. If so,
      the defect's INCIDENCE would correlate with the treatment arm, making it
      arm-asymmetric rather than merely wrong. Recorded as a risk with its
      mechanism; no measurement supports or refutes it yet.
    historical_census_result: >-
      COMPLETE, UNTRUNCATED census of 1,819 JSON records across v19, v20,
      v20_attempt2 and v20_attempt3 at /home/klz/Data/SIDEREIS_DATA. 630 metric
      strings total, of which 579 are health-check metrics and 51 are PREDICTION
      metrics. Breakdown: 29 exact "denoising_score" (parse via legacy alias),
      ZERO using the file_vector grammar, and 22 free-text prose forms.
    erratum_needed: >-
      NO. The forbidden path has never fired in a real run. No historical
      prediction-accuracy number needs correction.
    but_the_reason_matters: >-
      It is latent because the grammar is too OBSCURE for the model to use, NOT
      because the model avoided it. FOUR of the 22 prose forms explicitly ask
      for the aggregation - "HealthGate-valid denoising_score AVERAGED OVER
      validation files [15,16,17,18,19]" (2) and "HealthGate-valid MEAN
      denoising_score OVER files [15,16,17,18,19]" (2). The model repeatedly
      wanted a file-subset mean and could not express it in the grammar, so the
      evaluator discarded the prediction instead of computing it wrongly.
      Improve the grammar's discoverability, or use a stronger model, and the
      defect goes live immediately.
    second_finding_43_percent_silent_parse_failure: >-
      22 of 51 prediction metrics (43 percent) are free text and resolve to
      "unrecognized" -> None (prediction.py:249-250; the bound_id and
      legacy_alias matches at :242-245 are EXACT EQUALITY). They land in the
      unevaluated pool. So scientific_accuracy - the track record the proposer
      renders - is computed over a heavily filtered subset, and the filtering is
      invisible.
    this_supports_the_arm_asymmetry_mechanism: >-
      Previously recorded as MECHANISM-not-measurement. There is now partial
      support. Parse failure is driven by PROSE ELABORATION, and Gold's advice
      instructs the agent to make full and productive use of budgets and to
      explore broadly. If Gold's predictions are more elaborate, Gold's parse
      rate is LOWER, and the two arms' track records are computed over
      differently-filtered subsets. Still not a measurement of the arm effect -
      but the mechanism is no longer hypothetical, because the variation in
      prose elaboration is now observed.
    campaign_band_note: >-
      Every prose form scopes to files [15,16,17,18,19], the v19/v20 validation
      set. Under this campaign's bands a chain's model would naturally write "on
      files [0,1,2,3]" - the same prose shape, the same parse failure.
    dependencies: [D-SCORE-1, D-BEST-1, D-TREAT-4B]
    last_updated: 2026-08-26

  - decision_id: F-SCAND-2
