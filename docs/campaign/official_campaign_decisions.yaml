  # ============================================================== #
  # DECISION AREA 8 — FAILURE / RETRY / RESUME / RESTART           #
  # OPERATOR-FROZEN. 2026-08-26. No open campaign-design decisions.#
  # Documentation only; no audit, no production code change.       #
