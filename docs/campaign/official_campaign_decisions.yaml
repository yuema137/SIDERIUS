      the row located the defect. THE COUPLING IS NOT DISCHARGED HERE: F-LLM-2,
      the retry-bound divergence, is a separate row and remains as it was.
      Bounding retries at 3 is safe only if exhaustion does not consume
      scientific budget, and this fix is the half that makes that true.
