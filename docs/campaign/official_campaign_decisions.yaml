  - decision_id: F-SCANE-2
    parameter: TrainingDiagnosis is structurally degenerate at the campaign's frozen epoch count
    concept: the overfitting signal cannot fire in any formal round
    status: DISCHARGED
    superseded_status: PENDING_OPERATOR_DECISION
    ruling_2026_08_26: >-
