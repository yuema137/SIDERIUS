          the search finding it.
        required_capability: >-
          An exclusion enforced at the PAPER-RESOLUTION BOUNDARY — a
          campaign-level identifier denylist (arXiv id, S2 paper id, DOI, title
          match) applied to EVERY resolution path (root papers, search hits,
          escalations), each refusal recorded so the exclusion is auditable.
          Symmetric by construction: same denylist both arms, so capability
          stays identical and only the corpus is trimmed.
      residual_limitation: >-
        An identifier denylist cannot exclude a DIFFERENT paper that restates
        TIDMAD's baseline numbers — a survey, a citing work, a successor.
        Exclusion by identifier is enforceable and auditable; exclusion by
        SEMANTIC CONTENT is not, without a judgement layer that would itself
        become an unreviewed campaign variable. Achievable guarantee: no
        TIDMAD-IDENTIFIED SOURCE reaches either arm, NOT that no TIDMAD-derived
        fact can possibly appear.
    disposition:
      scientific_intent: FROZEN
      enabled_state_for_the_formal_campaign: PENDING_OPERATOR_DECISION
      enabled_state_note: >-
        The frozen intent (both arms keep the capability) implies ON in both.
        The shipped default is OFF in both, and the shipped launcher makes it
        the arm variable. This needs an explicit ruling.
      root_paper_removal: PENDING_IMPLEMENTATION (config-only)
