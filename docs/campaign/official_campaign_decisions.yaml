    the_relay_chain_recorded_because_the_middle_step_is_the_point: >-
      The Supervisor originated the premise in a routing brief; a sub-lane
      relayed it back to the Supervisor as a banked fact WITHOUT verifying; the
      campaign-planning lane recorded it into a durable artifact from that
      relay; the implementing writer caught it against source. A
      RELAYED-AND-UNVERIFIED FACT ACQUIRES THE APPEARANCE OF INDEPENDENT
      CONFIRMATION - it returns to its author looking corroborated. New
      sub-mechanism: CIRCULAR CORROBORATION THROUGH A RELAY.
    why_the_false_premise_MATTERED: >-
      It implied a fix - "pair the count with the ref's emission condition" -
      that would have fixed NOTHING, because on regime-A both fire together. The
      CORRECT rule was already written at the flag's own parser doc
      (train_engine_sandbox.py:1983-1998). The contract was stated at the flag
      and unhonoured at the emitter, so the fix honours a rule already written
      rather than inventing one.
    dependencies: [F-COV-2, M-RECONCILE-1, M-SCAN-1]
    last_updated: 2026-08-27

