  - decision_id: Q-LIT-1
    parameter: disposition of the literature-review topology
    concept: >-
      The shipped experiment's treatment variable was lit-review on/off.
      Decision Area 1 does not mention literature review. Is it part of the
      campaign at all, and if so is it now EXPERIMENT_FIXED (identical in both
      arms)?
    status: RESOLVED_BY_RULING
    superseded_status: PENDING_OPERATOR_DECISION
    control_class: EXPLICITLY_DISABLED
    reconciled_status_2026_08_27: >-
      RECONCILED against rulings that ALREADY EXIST, not answered by this lane
      and not a new operator question. Both ruling rows are FROZEN and both are
      in this copy. They are quoted VERBATIM below, each against the half of
      this row's question it answers, so a reader can check the mapping instead
      of trusting a paraphrase. HOW THIS ROW WAS FOUND is worth recording: it
      was NOT found by diffing the two writers of this file, because master and
      the campaign-planning branch are IDENTICALLY STALE on it - a two-writer
      diff is structurally blind to a row both writers forgot. It surfaced only
      from a domain DERIVED from what a row is (tools/
      campaign_undispositioned_report.py), and it is the concrete instance
      justifying that report's recorded enforcement debt.
    ruling_half_1_is_it_part_of_the_campaign_at_all: >-
      ANSWERED by Q-LIT-1-RULING (FROZEN, decided 2026-08-26, operator ruling
      relayed by Supervisor [ceb12d]), whose frozen_value reads VERBATIM:
      "Literature review is OFF for official Gold v1. Rationale: no unpinned
      DeepSeek authority may participate in official scientific decisions." The
      rationale also disposes of this row's recorded current_framework_default
      lit_review_llm {provider: deepseek, model_id: deepseek-v4-pro} - the
      unpinnable authority IS the stated reason. NO INFERENCE STEP: the ruling
      names this row's subject and negates it directly.
    ruling_half_2_is_it_identical_in_both_arms: >-
      ANSWERED by Q-LIT-1-CONSTRAINT (FROZEN, decided 2026-08-26, operator
      ruling relayed by Supervisor [ceb12d]), whose frozen_value reads VERBATIM:
      "The new entrypoint must treat literature review as a SYMMETRIC campaign
      setting across both arms, whatever Q-LIT-1 decides about enabling it." It
      answers UNCONDITIONALLY - "whatever Q-LIT-1 decides" - which matters here,
      because half 2 of this row's question is phrased conditionally ("and IF SO
      is it now ...") and half 1's answer makes that antecedent false. The
      symmetry half is therefore answered on its own terms rather than left
      vacuous by a false antecedent. NO INFERENCE STEP.
    why_it_matters_is_discharged: >-
      This row's stated stake was: "Left unruled, the campaign would carry two
      simultaneous variables and no effect could be attributed to either." OFF
      plus SYMMETRIC leaves lit-review as no variable at all, so the campaign
      carries one variable. The stake is discharged, not merely deferred.
    the_one_thing_NOT_taken_verbatim_and_why: >-
      This row asks whether lit-review is "now EXPERIMENT_FIXED". NEITHER ruling
      uses that term, so it is NOT asserted. control_class is set to
      EXPLICITLY_DISABLED, which the PLAN'S OWN section 0 defines as "Feature is
      deliberately off, and the campaign config materialises the 'off'
      explicitly rather than relying on a default" - a declared value whose
      definition the two rulings satisfy word for word, and a STRICTER answer
      than EXPERIMENT_FIXED because it additionally requires the explicit
      materialisation that Q-LIT-1-RULING's persistence_requirement demands and
      that the launcher performs. Recorded rather than silently chosen: a
      paraphrase that closes a row is how a ruling acquires scope it never had.
    mechanism_and_persistence_verified_2026_08_27: >-
      Q-LIT-1-RULING's persistence_requirement - the disabled state must be a
      NAMED ABSENCE in the manifest and runbook, never an omission - is MET on
      origin/master f69c9acf, checked at source rather than assumed.
      _chain_common.sh:257-262 declares the tri-state ("" forwards nothing, 1
      forwards the positive flag, 0 forwards the EXPLICIT negative);
      :436-437 parses both flags; :742-745 emits --no-ml_lit_review_enabled on
      the "0" leg. _gold_campaign_lib.sh:744 and :763 set it on BOTH arms -
      goldpod and blindpod alike, which is the symmetry half executed rather
      than merely declared - :819 reserves both flags from passthrough, and
      run_gold_campaign.sh:233 prints it while :249 writes it into the launch
      manifest. CITATION DRIFT RECORDED, mechanism unaffected: Q-LIT-1-RULING
      cites "_chain_common.sh:200 and :641-644" and those lines now hold
      unrelated code - #356 inserted a defaults block above them. The line
      numbers are stale; the mechanism is exactly as the ruling describes. A
      row's cited line number is a pointer, not the evidence.
    status_choice_is_deliberate: >-
      RESOLVED_BY_RULING, now DECLARED in the plan's section 0.1 and in this
      file's status_vocabulary and terminal_statuses. An earlier pass set FROZEN
      instead and recorded why: the value was declared in NEITHER authority and
      carried by NO row, so writing it would have imported a status into the
      authority out of a guard's private vocabulary - the defect running
      backwards on the pass that diagnosed it. That objection is now discharged
      at its cause rather than worked around, so the accurate status is used.
      IT IS NOT A SYNONYM FOR FROZEN. FROZEN means "operator has ruled, the
      value is binding" and fits a row carrying its OWN ruling and its own value
      (Q-FCNET-REF-1's lineage, D-BUD-17's band-local +2, F-SCANC-1's RETIRE).
      This row holds NO value: it asked a question, and two OTHER rows' rulings
      answer it. Calling that FROZEN would assert a binding value the row does
      not have. It is equally not MOOT: F-SCANH-2's question stopped ARISING,
      whereas this one arises and is ANSWERED. Those three rows are deliberately
      NOT re-statused here - each carries its own ruling, FROZEN is correct for
      them, and re-labelling settled rows was not authorised.
    why_it_matters: >-
      Left unruled, the campaign would carry two simultaneous variables and no
      effect could be attributed to either.
    current_framework_default:
      with_arm: "--ml_lit_review_enabled"
      without_arm: "--no-ml_lit_review_enabled"
      lit_review_llm: {provider: deepseek, model_id: deepseek-v4-pro}
