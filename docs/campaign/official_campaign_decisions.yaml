      - {level: 2, requirement: typed dynamic vs static semantics — the distinction is a TYPE, not a convention}
      - {level: 3, requirement: real runtime producer — production code populates it during a real run}
      - {level: 4, requirement: persistence — it survives into the record}
      - {level: 5, requirement: downstream / report exposure — a consumer actually reads it}
    evidence_rule_binding: >-
      TrainingHistory.observations schema support and hand-authored fixtures DO
      NOT count as implementation evidence.
    current_state_audited:
      typed_dynamic_static_distinction: NOT_IMPLEMENTED     # dynamic_metric/static_metric/observation_metrics = 0 hits; 'observable' only as English prose
      task_declaration_of_observables: NOT_IMPLEMENTED      # _MANIFEST_KEYS is a CLOSED 13-key allowlist that hard-refuses unknown keys
      training_history_observations: SCHEMA_ONLY            # VERIFIED: 169 occurrences across 165 real files, EVERY ONE {}; zero producers; zero consumers
      training_loss_curve_per_epoch: FULLY_IMPLEMENTED      # but this is the training OBJECTIVE, not a declarable observable
      validation_loss_curve_per_epoch: FULLY_IMPLEMENTED    # same caveat
      per_step_per_batch_curve: NOT_IMPLEMENTED             # named a permanent gap at run_report.py:1088-1090
      validation_metric_curve: NOT_IMPLEMENTED              # R3 computes the objective only, never the Golden Metric
      secondary_metrics_static_like: FULLY_IMPLEMENTED      # declarable/produced/persisted/consumed — but only on 2 of 3 scoring routes
    gap_to_close: >-
      Levels 1 and 2 do not exist at all, and level 3 does not exist for the
      observations carrier. The nearest working precedent is secondary_metrics:
